# Visual regression vs the last passing build (utopia-models/knowledge#14826). The baseline in design/baseline/ is the
# previous main build, re-recorded by ui-visual-record.yml; no human approves it. Canonical script:
# utopia-models/knowledge _infra/ci/ui-gate/ui-visual.mjs (byte-identical copy in scripts/).
name: ui-visual-check
on:
  pull_request:
    paths: ["*.html", "site/**", "design/ui-gate.json", "scripts/ui-visual.mjs"]
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install the gate (outside the repo)
        run: |
          d="$RUNNER_TEMP/ui-gate"; mkdir -p "$d"; cp scripts/ui-visual.mjs "$d/"
          printf '{"private":true,"type":"module","dependencies":{"playwright":"1.64.0","pngjs":"7.0.0","pixelmatch":"6.0.0"}}' > "$d/package.json"
          (cd "$d" && npm install --no-audit --no-fund --silent)
          if [ -d /srv/ms-playwright/chromium-1248 ] && [ -d /srv/ms-playwright/webkit-2370 ]; then
            echo "PLAYWRIGHT_BROWSERS_PATH=/srv/ms-playwright" >> "$GITHUB_ENV"
          else
            (cd "$d" && npx playwright install --with-deps chromium webkit)
          fi
      - name: Serve and check
        run: |
          port=$((20000 + RANDOM % 20000))
          nohup npx --yes serve@14 -l "$port" . > "$RUNNER_TEMP/serve.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/serve.pid"
          for i in $(seq 1 60); do curl -sf -o /dev/null "http://127.0.0.1:$port/" && break; sleep 1; done
          rc=0; node "$RUNNER_TEMP/ui-gate/ui-visual.mjs" check "http://127.0.0.1:$port" || rc=$?
          kill "$(cat "$RUNNER_TEMP/serve.pid")" 2>/dev/null || true; exit $rc
