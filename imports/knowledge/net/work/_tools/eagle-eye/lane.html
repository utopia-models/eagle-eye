:root{--bg:#070706;--gold:#d9b35b;--pale:#f3dc9a;--ink:#e9dcc0;--dim:#b8ac88;--sand:#c9b88f;--line:rgba(217,179,91,.16);

#dust{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:0}
a{color:inherit}
.wrap{position:relative;z-index:1;max-width:1720px;margin:0 auto;padding:clamp(14px,2vw,34px) clamp(16px,3.2vw,64px) 64px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;position:relative;z-index:2}

.back:hover{color:var(--pale);letter-spacing:.5em}
.mark{display:none}
/* hero: one focus — the lane's glyph in sand, its name, its numbers, a horizon */
.hero{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;
  padding-top:clamp(130px,16vh,184px);padding-bottom:clamp(34px,4.5vh,60px);margin:0 calc(-1 * clamp(16px,3.2vw,64px))}
#glyph{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.side{position:relative;letter-spacing:.7em;font-size:12px;color:var(--gold);opacity:1;margin-left:.7em}
h1{position:relative;margin:.38em 0 .2em;font-weight:400;font-size:clamp(38px,5.4vw,88px);letter-spacing:.2em;margin-right:-.2em;

  color:var(--pale);font-variant-numeric:lining-nums tabular-nums;line-height:1}

.note{text-wrap:balance;position:relative;padding:0 1.4em;font-family:var(--serif);font-style:italic;font-size:17px;color:var(--sand);line-height:1.5;max-width:62ch;margin:1.2em auto 0;text-align:center}
/* the three readings, de-boxed: hairlines that fade at both ends, like the horizon */
.grid{display:grid;gap:clamp(30px,3vw,64px);grid-template-columns:minmax(0,1fr);align-items:start;margin-top:clamp(26px,3vh,44px)}

tbody tr{transition:background .25s}
tbody tr:hover{background:linear-gradient(90deg,rgba(217,179,91,.07),transparent)}
td.n0{color:#8a7f64}
td:first-child{font-family:var(--serif);font-weight:500;font-size:19px;letter-spacing:.01em;color:var(--pale);white-space:normal;line-height:1.25}
td:first-child .nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.stage{white-space:normal;font-style:italic;font-weight:400;font-size:17px;padding-left:.9em;color:var(--sand);text-align:left}
td.last{font-size:17px;color:var(--dim)}
.tscroll{overflow-x:auto}
th.c0{width:auto}th.cn{width:4.6em;text-align:center}th.cr{width:6.4em}th.cl{text-align:right}

.panel .sub:empty{display:none}th.cs{width:7.4em;text-align:center}th.cl{width:4em}
.tb{display:inline-block;font-family:var(--caps);font-size:9.5px;letter-spacing:.12em;padding:.12em .4em;margin-left:.6em;vertical-align:2px;border-radius:1px}
.t1{background:var(--gold);color:#120f08}.t2{border:1px solid var(--gold);color:var(--gold)}.t3{border:1px solid #5d5544;color:#a89a7a}

.tier{margin-bottom:1.6em}
.tier h3{margin:0 0 .75em;font-weight:400;font-size:12.5px;letter-spacing:.4em;color:var(--pale);display:flex;justify-content:space-between;align-items:baseline;gap:1em}

#archbtn{position:absolute;right:130px;top:50%;transform:translateY(-50%);font-family:var(--caps);font-size:11.5px;letter-spacing:.22em;color:var(--gold);background:transparent;border:1px solid var(--gold);border-radius:3px;padding:.55em 1.1em;cursor:pointer;min-height:40px}#archbtn[hidden]{display:none}
#refresh:hover,#refresh:focus-visible{background:rgba(217,179,91,.12);outline:none}
header{position:relative}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{pointer-events:auto;opacity:1}
.drawer{position:fixed;z-index:21;background:#0f0e0b;border-left:1px solid var(--line);top:0;right:0;bottom:0;width:min(600px,100vw);overflow:auto;overscroll-behavior:contain;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.7,.2,1);padding:0 0 40px;visibility:hidden;font-family:var(--serif)}
.drawer.on{transform:none;visibility:visible}
@media (max-width:760px){.drawer{left:0;top:auto;width:100%;height:88vh;border-left:0;border-top:1px solid var(--line);border-radius:12px 12px 0 0;transform:translateY(105%)}.drawer.on{transform:none}}
.dh{position:sticky;top:0;background:#0f0e0b;border-bottom:1px solid var(--line);padding:14px 18px 12px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;z-index:1}
.dh .co{font-size:22px;font-weight:600;color:var(--pale);white-space:normal}.dh .role{font-size:15px;color:var(--sand);margin-top:2px;font-style:italic}
.xbtn{background:none;border:1px solid var(--line);border-radius:6px;color:var(--gold);width:44px;height:44px;flex:0 0 auto;cursor:pointer;font-size:20px}
.db{padding:6px 18px}
.db h5{margin:22px 0 8px;font-family:var(--caps);font-weight:400;font-size:10.5px;letter-spacing:.32em;color:var(--gold)}
.db dl{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:7px 12px;margin:0;font-size:15.5px}
.db dt{color:var(--dim)}.db dd{margin:0;color:var(--ink);overflow-wrap:anywhere}.db dd a{color:var(--pale);text-underline-offset:3px}
.db .ptext{white-space:pre-wrap;font-size:16px;line-height:1.5;color:var(--ink);border-left:1px solid var(--line);padding-left:12px;margin:0}
.db .empty{font-style:italic;color:var(--sand)}
.db ul{margin:0;padding-left:1.1em;font-size:14.5px;color:var(--sand)}
@media (prefers-reduced-motion:reduce){.panel,.back,.chip,.drawer,.scrim{transition:none}}
.exact{display:block;font-size:10.5px;color:var(--dim);letter-spacing:.02em;white-space:normal;line-height:1.25;margin-top:.15em}
</style>
</head>
<body>
<canvas id="dust" aria-hidden="true"></canvas>
<div class="wrap">
  <header><a class="back" href="/" id="back">&larr; EAGLE EYE</a><div class="mark" id="mark">EAGLE EYE</div><button id="archbtn" type="button" hidden title="open the one-shot architecture diagram">ARCHITECTURE</button><button id="refresh" type="button" title="reload this page and its data">REFRESH</button></header>
  <section class="hero">
    <canvas id="glyph" aria-hidden="true"></canvas>
    <div class="side" id="side"></div><h1 id="name">&nbsp;</h1><div class="who" id="who"></div>
    <div class="totals" id="totals"></div>
    <p class="note" id="note" hidden></p>
  </section>
  <div class="grid">
    <section class="panel p-up" id="pmat" hidden aria-labelledby="hmat"><h2 id="hmat">IN PROGRESS</h2><p class="sub">Matches still being worked, one row per job: job, time since posting, demo, VSL, status. A proposal goes out only when its VSL is ready.</p><div class="tscroll"><table class="ut" id="umat"></table></div></section>
    <section class="panel p-up" id="pup" hidden aria-labelledby="hup"><h2 id="hup">APPLIED</h2><div class="tscroll"><table class="ut" id="uapp"></table></div></section>
    <section class="panel p-24" aria-labelledby="h24"><h2 id="h24">LAST 24 HOURS</h2><p class="sub" id="s24"></p><div class="tiles-h" id="tilesh"></div><div class="tiles" id="tiles"></div><ol class="ev" id="ev"></ol><button class="more" id="evmore" hidden>SHOW MORE</button></section>
    <section class="panel p-co" aria-labelledby="hco"><h2 id="hco">BY COMPANY</h2><p class="sub" id="sco"></p><div class="tscroll"><table id="co"></table></div><p class="empty" id="coempty" hidden></p><button class="more" id="more" hidden></button></section>
    <section class="panel p-ti" aria-labelledby="hti"><h2 id="hti">TARGET TIERS</h2><p class="sub" id="sti"></p><div class="legend"><span class="lh">this lane</span><span class="le">another lane</span><span class="ln">not touched yet</span></div><div id="tiers"></div></section>
  </div>
  <div class="foot" id="foot"></div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-co" aria-hidden="true">
  <div class="dh"><div><div class="co" id="d-co"></div><div class="role" id="d-role"></div></div><button class="xbtn" id="d-x" aria-label="Close">&times;</button></div>
  <div class="db" id="d-body"></div>
</aside>
<div id="arch" hidden role="dialog" aria-label="One-shot architecture"><button class="x" id="archx">CLOSE</button><div id="archb"></div></div>
<script>
// LANES:BEGIN (generated by lane_page.py from home-live.js PIPES + DOORS)
const LANES = {};
// LANES:END
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// knowledge#14253 (Tyler 2026-11-16 12:14 and 12:43 MT): LinkedIn and cold email fold into Cold apps (each cold app's
// campaign panel), Social is off Eagle Eye for now: their old links land on Cold apps / the home page, never a 404
{ const g = location.pathname.match(/^\/(?:hunt|roost|lane)\/(linkedin|cold[_-]email|social)\/?$/);
  if (g) location.replace(g[1] === 'social' ? '/' : '/hunt/cold_apps'); }
const m = location.pathname.match(/^\/(hunt|roost)\/([a-z_-]+)/) || [];
const side = m[1], key = (m[2]||'').replace(/-/g,'_');
const L = LANES[key];
if(key==='upwork' && side==='hunt'){ document.body.classList.add('upw'); $('mark').textContent='UPWORK · APPLIED'; }
const ago = ts => { const s=(Date.now()-Date.parse(ts))/60000; if(s<0){const f=-s; return f<90?`in ${Math.round(f)} min`:f<2880?`in ${Math.round(f/60)} h`:`in ${Math.round(f/1440)} d`;} return s<90?`${Math.round(s)} min ago`:s<2880?`${Math.round(s/60)} h ago`:`${Math.round(s/1440)} d ago`; };
const exactET = ts => new Date(ts).toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' ET';
const mins = ts => { const m=Math.round((Date.now()-Date.parse(ts))/60000); return m<0?'in '+(-m)+' min':m+' min ago'; };
const hhmm = ts => { const d=new Date(ts); const today=new Date(); const same=d.toDateString()===today.toDateString(); return same ? d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : d.toLocaleDateString([], {month:'short',day:'numeric'}); };
const short = ts => { const m=Math.max(0,(Date.now()-Date.parse(ts))/60000); return m<90?`${Math.round(m)}m`:m<2880?`${Math.round(m/60)}h`:`${Math.round(m/1440)}d`; };
const KIND = k => { const t = String(k||'').replace(/_/g,' ').trim(); return ({'event new':'event found','event found':'event found','sent':'message sent'})[t] || t; };
let showAll = false, showEv = false;
const PART = /^(sent|found|funded|paid|started|submitted|booked|held|cancelled|received|viewed)$/;
const plw = w => /s$/.test(w) ? w : /[^aeiou]y$/.test(w) ? w.slice(0,-1)+'ies' : w.toLowerCase()==='vsl' ? 'VSLs' : w+'s';
const PLURAL = (k, n) => { if(n===1) return k; const w = k.split(' ');
  if(w.length===1) return PART.test(w[0]) ? k : plw(w[0]);
  const i = PART.test(w[w.length-1]) ? w.length-2 : w.length-1; w[i] = plw(w[i]); return w.join(' '); };
const SRC = t => String(t||'').replace(/(?:~?\/?[\w.-]+\/)*([\w-]+)\.(db|jsonl|csv|json)/g, (m,n)=>n.replace(/-/g,' ')).replace(/\bsf\//g,'');

// knowledge#14131: each row's VSL-sent state and next action. A next step the store wrote (pipeline.jsonl next_step) is
// shown as it is; otherwise NEXT applies this rule to the row's measured state, so no row is ever without one.
const nk = s => String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const DAY = 864e5, FOLLOW_D = 5;
const vslCell = n => `<td class="vsl${n?' on':' n0'}" data-l="VSL">${n?`sent${n>1?' ×'+n:''}`:'not sent'}</td>`;
function nextAction(r){   // r: {stage, replies, vsls, sent, last, next, side}
  if(r.next) return [String(r.next), false];
  const st = String(r.stage||'').toLowerCase(), v = r.vsls||0;
  const age = r.last ? (Date.now()-Date.parse(r.last))/DAY : null;
  const due = r.last ? new Date(Date.parse(r.last)+FOLLOW_D*DAY).toLocaleDateString([], {month:'short',day:'numeric'}) : '';
  if(/reject|cancel|declin|lost|closed/.test(st)) return ['none: closed', true];
  if(/offer/.test(st)) return ['negotiate the offer', false];
  if(/interview|screen|assessment/.test(st)) return [age!=null&&age<0 ? `prep for the ${st.split(/[^a-z]/)[0]}` : `send a thank-you${v?'':' + VSL'}`, false];
  if(/not sent|draft/.test(st)) return ['send the proposal', false];
  if(/contract|hourly|paid|milestone|direct|hired/.test(st)) return [v ? 'deliver, then invoice' : 'send an upsell VSL', false];
  if(r.replies>0) return [v ? 'book the call' : 'reply with a VSL', false];
  if(r.sent){ if(age!=null && age>=FOLLOW_D) return [v ? 'follow up' : 'follow up with a VSL', false];
    return [`wait for a reply${due?' · follow up '+due:''}`, true]; }
  return [r.side==='roost' ? 'reach out with a VSL' : 'first touch', false];
}
const nxCell = r => { const [t, dim] = nextAction(r); return `<td class="nx${dim?' dn':''}" data-l="next" title="${r.next?'next step written by the lane':'next action from the row\'s stage, replies, VSLs and age'}">${esc(t)}</td>`; };
function head(d){
  if(!L || L.side!==side){ document.title='Eagle Eye: no such lane'; $('name').textContent='No such lane'; $('note').hidden=false;
    $('note').textContent=`"${location.pathname}" is not a hunt or roost on Eagle Eye.`; return false; }
  document.title = `Eagle Eye ${L.name} page`;
  if(key!=='upwork') $('mark').textContent = `EAGLE EYE · ${L.name.toUpperCase()}`;
  $('side').textContent = side==='hunt' ? 'HUNT · WHAT WE SEND OUT' : 'ROOST · WHAT COMES BACK';
  $('name').textContent = L.name;
  const door = L.door||{};
  $('who').innerHTML = door.agent ? `worked by <b>${esc(door.agent)}</b>${door.url?` · <a href="${esc(door.url)}">open its ${door.kind==='desk'?'desk':'view'}</a>`:''}` : '';
  const blk = (d && (side==='hunt' ? (d.hunts||{})[key] : (d.roosts||{})[key])) || null;
  let t = '';
  if(side==='hunt'){
    if(blk && blk.sent==null && blk.found!=null){
      t += `<div class="tot"><b><span class="cnt" data-n="${blk.found}">${blk.found}</span><i>found</i></b><small>none sent yet</small></div>`;
    }
    if(blk && blk.sent!=null){
      const lb = blk.labels || ['sent','back'];   // knowledge#13746: a lane names its own two numbers (In person: found / this week)
      t += `<div class="tot"><b><span class="cnt" data-n="${blk.sent}">${blk.sent}</span><i>${esc(lb[0])}</i></b><small>${esc(blk.window||'')}</small></div>`;
      t += `<div class="tot"><b><span class="cnt" data-n="${blk.answered||0}">${blk.answered==null?'—':blk.answered}</span><i>${esc(lb[1])}</i></b><small>${blk.labels?'':(blk.sent?Math.round(100*(blk.answered||0)/blk.sent)+'% came back':'')}</small></div>`;
      if(blk.sent_total!=null) t += `<div class="tot"><b><span class="cnt" data-n="${blk.sent_total}">${blk.sent_total}</span><i>all time</i></b><small>submitted</small></div>`;
    }
  } else if(blk){
    const nr = (blk.rows||[]).length;
    if(nr || blk.status!=='empty') t += `<div class="tot"><b><span class="cnt" data-n="${nr}">${nr}</span><i>${key==='clients'?'clients':'people'}</i></b><small>${({clients:'with prospects, from the CRM', social:'who wrote in on YouTube, X, Instagram, TikTok', network:'everyone Tyler knows: his contacts, WhatsApp and LinkedIn'})[key]||'recruiters and hiring teams'}</small></div>`;
  }
  if($('totals').dataset.t !== t){ $('totals').innerHTML = t; $('totals').dataset.t = t; countUp(); }
  GL.set(side, blk);
  const why = blk && (blk.reason || (blk.status==='empty' ? 'no live numbers for this lane' : ''));
  $('note').hidden = !why; if(why){ $('note').textContent = String(why).replace(/^\d+ events? found,?\s*/i,'').replace(/\s*\([^)]*\)/g,'').replace(/^./,c=>c.toUpperCase()).replace(/\s*\([^)]*[~\/][^)]*\)/g,'').replace(/~?\/?[\w.-]+\/[\w./-]+\.(jsonl|json|csv|db)/g,'its store').replace(/\b(rahman|horus|atlas|purser|jobs|peaky)\b/g, w=>w[0].toUpperCase()+w.slice(1)); $('note').title = blk.source||''; }
  return blk;
}

function last24(lf){
  const lane = rosterLane(lf) || (lf.lanes||{})[key] || {events:[]};
  const now = Date.now(), day = 864e5;
  const evs = lane.events||[];
  const up = evs.filter(e=>e.up).sort((a,b)=>a.ts<b.ts?-1:1);
  const past = evs.filter(e=>!e.up);
  const d1 = past.filter(e=>now-Date.parse(e.ts) <= day), d7 = past;
  const byKind = {}; d1.forEach(e=>{const k=KIND(e.kind); byKind[k]=(byKind[k]||0)+1;});
  const k7 = {}; d7.forEach(e=>{const k=KIND(e.kind); k7[k]=(k7[k]||0)+1;});
  const kinds = Object.keys(k7).sort((a,b)=>(byKind[b]||0)-(byKind[a]||0) || k7[b]-k7[a]).slice(0,6);
  const nd0 = lf.event_days||7;
  $('h24').textContent = 'LAST 24 HOURS';
  $('s24').textContent = d1.length ? (kinds.length > 1 ? `${d1.length} in the last 24 hours` : '') :
    (d7.length ? `Quiet for a day. The newest was ${ago(d7[0].ts)}.` : '');
  $('tilesh').textContent = !d1.length && d7.length ? `THE LAST ${nd0} DAYS` : '';
  $('s24').title = 'source: ' + (lane.source||'');
  const nd = lf.event_days||7;
  $('tiles').innerHTML = kinds.map(k=> d1.length ? `<div class="tile"><b class="${byKind[k]?'':'z'}">${byKind[k]||0}</b><i>${esc(PLURAL(k, byKind[k]||0))}</i><small>${k7[k]} in ${nd} days</small></div>`
    : `<div class="tile"><b>${k7[k]}</b><i>${esc(PLURAL(k, k7[k]))}</i><small></small></div>`).join('');
  let list = (d1.length ? d1 : d7.slice(0,12));
  const cap = showEv ? 999 : innerWidth < 600 ? 4 : 8, hiddenN = Math.max(0, list.length - cap); list = list.slice(0, cap);
  const dd = t => String(t||'').replace(/\b(\d{4})-(\d{2})-(\d{2})\b/g, (m,y,mo,d)=>new Date(+y,+mo-1,+d).toLocaleDateString([], {month:'short',day:'numeric'}));
  const row = (e,cls) => `<li class="${cls||''}"><time datetime="${esc(e.ts)}" title="${esc(exactET(e.ts))} · ${esc(mins(e.ts))}">${cls?'next':hhmm(e.ts)}<small class="exact">${cls?'':esc(exactET(e.ts))+' · '+esc(mins(e.ts))}</small></time><div class="c" title="${esc(e.co)}">${esc(e.co||'—')}</div><div class="k"><span class="kind">${esc(KIND(e.kind))}</span>${esc(dd(cls?ago(e.ts)+(e.what?' · '+e.what:''):e.what))}</div></li>`;
  $('ev').innerHTML = up.map(e=>row(e,'up')).join('') + list.map(e=>row(e)).join('') ||
    `<li style="display:block;padding:0;border:0"><div class="empty">Nothing dated in this lane in ${nd} days.</div></li>`;
}

function companies(lf, blk){
  const nEv = ((((lf.lanes||{})[key]||{}).events||[]).filter(e=>!e.up).length);
  $('evmore').hidden = showEv || nEv <= (innerWidth < 600 ? 4 : 8);
  if(rosterLane(lf) && altRows(lf, blk)) return;
  const all = lf.companies||{}, lane = (lf.lanes||{})[key] || {companies:[]};
  const keys = lane.companies||[];
  const rows = keys.map(k=>({k, ...all[k]}));
  const roostRows = {}; ((blk&&blk.rows)||[]).forEach(r=>{ roostRows[String(r.name||'').toLowerCase().replace(/[^a-z0-9]/g,'')]=r; });
  const N = rows.length, lim = showAll ? N : Math.min(N, 40);
  const ONE = {apps:'app', replies:'reply', proposals:'proposal'};
  const nz = (v, l) => `<td class="num ${v?'':'n0'}" data-l="${v===1&&ONE[l]?ONE[l]:l}">${v||'–'}</td>`;
  $('hco').textContent = key==='upwork'||key==='clients' ? 'BY CLIENT' : 'BY COMPANY';
  $('sco').textContent = N ? `${N} ${key==='upwork'||key==='clients'?(N===1?'client or job':'clients and jobs'):(N===1?'company':'companies')} this lane touched, newest first. Each row counts everything sent to and heard from them.` :
    '';
  document.querySelector('.p-co').classList.toggle('slim', !N);
  if(!N && altRows(lf, blk)) return;
  if(!N){ $('co').innerHTML = ''; $('coempty').hidden=false;
    $('coempty').textContent = key==='in_person' ? 'Events are listed by name under Last 24 hours. A company appears here once someone is met.' : 'No company has come through this lane yet.'; $('more').hidden=true; return; }
  $('coempty').hidden = true;
  const up = key==='upwork' || key==='clients';
  // every lane counts VSLs per company (knowledge#13617 round 3): job lanes read apps · mail · VSL · replies
  $('co').innerHTML = `<thead><tr><th class="c0">${up?'CLIENT / JOB':'COMPANY'}</th>${up?'<th class="cn">PROP</th>':'<th class="cn">APPS</th><th class="cn">MAIL</th>'}<th class="cn cr">REPLIES</th><th class="cs">STAGE</th><th class="cl">LAST</th><th class="cv">VSL SENT</th><th class="cx">NEXT</th></tr></thead><tbody>` +
    rows.slice(0,lim).map(r=>{ const rr = roostRows[r.k] || roostRows[nk(String(r.name||'').split(' ')[0])]; const st = r.stage || (rr&&rr.stage) || '';
      return `<tr><td title="${esc(r.name)}"><span class="nm">${esc(r.name)}${r.tier?`<span class="tb t${Math.min(3,r.tier)}" title="target tier ${r.tier}">T${r.tier}</span>`:''}</span></td>${up?nz(r.proposals,'proposals'):nz(r.apps,'apps')+nz(r.emails,'mail')}${nz(r.replies,'replies')}<td class="stage${st?'':' n0'}" data-l="stage">${st?esc(st):'–'}</td><td class="last${r.last?'':' n0'}" title="${esc(r.last||'')}">${r.last?esc(short(r.last)):'–'}</td>${vslCell(r.vsls)}${nxCell({stage:st, replies:r.replies, vsls:r.vsls, sent:(r.apps||0)+(r.emails||0)+(r.proposals||0)+(rr?1:0)+(side==='hunt'?1:0), last:r.last, next:rr&&rr.next, side})}</tr>`; }).join('') + '</tbody>';
  $('more').hidden = N <= 40; $('more').textContent = showAll ? 'SHOW THE NEWEST 40' : `SHOW ALL ${N}`;
}

// knowledge#14131: a lane whose rows are not companies (Social: the people who wrote in; In person: the events found)
// still gets one row each with its VSL-sent state and next action.
const NOISE = /liked a message|reacted|sent a post|sent an attachment|^https?:\/\//i;
function altRows(lf, blk){
  const all = lf.companies||{};
  let rows = [], h = '', sub = '';
  if(key==='in_person'){
    const evs = (((lf.lanes||{})[key]||{}).events||[]).filter(e=>!e.up);
    rows = evs.map(e=>{ const dt = (String(e.what||'').match(/(\d{4}-\d{2}-\d{2})/)||[])[1]; const fut = dt && Date.parse(dt+'T23:59:59') >= Date.now();
      return {name:e.co, what:e.what, last:e.ts, vsls:0, nx:[fut ? 'RSVP, go, log who you met' : 'log who you met (or none)', !fut]}; });
    h = 'BY EVENT'; sub = `${rows.length} events found in ${lf.event_days||7} days, newest first. Each person met becomes a row with their own VSL.`;
  } else if(side==='roost' && blk && (blk.rows||[]).length){
    rows = blk.rows.map(r=>{ const c = all[nk(r.name)]||{}; const noise = NOISE.test(r.what||'');
      return {name:r.name, what:[r.stage, r.what].filter(Boolean).join(' · '), last:r.at, vsls:c.vsls||0,
              nx: r.next ? [r.next, false] : noise ? ['none: not a lead', true] : nextAction({stage:r.stage&&/reject|cancel|contract|hourly|paid/i.test(r.stage)?r.stage:'', replies:1, vsls:c.vsls||0, last:r.at, side})}; });
    if(key==='network'){   // knowledge#14240: a number is never shown (an unsaved WhatsApp chat is its JID); the ask goes only to a tyler@ contact
      rows.forEach((r,i)=>{ const src = blk.rows[i]||{}; const d = String(r.name||'').replace(/@.*$/,'').replace(/\D/g,'');
        if(/@s\.whatsapp\.net|@lid\b|@c\.us\b/.test(r.name||'') || (d.length>=7 && d.length>=String(r.name||'').replace(/[\s+()-]/g,'').length-1)) r.name = 'unsaved number';
        r.nx = src.referral_ok ? (r.vsls ? ['follow up on the VSL', false] : ['send a VSL with the referral ask', false]) : ['none: not in his contacts', true]; });
      rows.sort((a,b)=>String(b.last||'').localeCompare(String(a.last||'')));
    }
    h = 'BY PERSON'; sub = key==='network' ? `${rows.length} people Tyler knows, the most recent conversation first. Each row is one person with every channel he reaches them on.` : `${rows.length} ${rows.length===1?'person':'people'} on this roost, newest first.`;
  }
  if(!rows.length) return false;
  const N = rows.length, lim = showAll ? N : Math.min(N, 40);

  h += `<h5>CLIENT</h5><dl>${row('Client', j.client?esc(j.client):'<span class="empty">not in the alert or the score</span>')}`+
    (c ? `${row('Name', esc(c.client))}${row('Contract', esc(c.id||'')+' · '+esc(c.status))}${row('Milestones', (c.milestones||[]).map(m=>`M${m.n} $${m.amount} ${esc(m.state)}`).join(' · ')||null)}${row('Paid', c.paid?esc(money(c.paid)):null)}${row('Last reply', c.lastReply?esc(fmtT(c.lastReply.ts))+(c.lastReply.what?' · '+esc(c.lastReply.what.slice(0,240)):''):null)}` : '')+`</dl>`;
  const SK = ['viewed','replied','interview','call','hired','declined'].filter(s=>st[s]);
  h += `<h5>DATES</h5><dl>${row('Sent', esc(fmtT(a.sentAt)))}${SK.map(s=>row(s[0].toUpperCase()+s.slice(1), esc(fmtT(st[s])))).join('')}${SK.length?'':row('Since', 'no view, reply or interview recorded')}</dl>`;
  h += `<h5>VSL</h5><dl>${row('Attached', v.attached?'yes'+(v.kind?' · '+esc(v.kind):''):'no')}${row('Recorded', v.recorded?'yes':'no')}${row('File', v.file?esc(v.file):null)}${row('When', v.at?esc(fmtT(v.at)):null)}${row('Plan', v.verdict?esc(String(v.verdict).replace(/_/g,' ').toLowerCase()):null)}</dl>`;
  h += `<h5>POLYMARKET-TYPE DEMO</h5><dl>${row('Built', d.live?'yes':'no')}${row('Demo', d.url?lnk(d.url, d.url.replace(/^https:\/\//,'').replace(/\/$/,'')):null)}${row('Picked', d.picked?esc(fmtT(d.picked))+(d.big?' · marked big':''):null)}</dl>`;
  $('d-body').innerHTML = h;
  if(keep) return;
  $('drawer').classList.add('on'); $('drawer').setAttribute('aria-hidden','false'); $('scrim').classList.add('on');
  $('drawer').scrollTop = 0; $('d-x').focus();
  if(location.hash !== '#'+k) history.pushState(null, '', location.pathname+location.search+'#'+encodeURIComponent(k));
}
function closeDrawer(fromPop){
  if(!sel){ $('drawer').classList.remove('on'); $('drawer').setAttribute('aria-hidden','true'); $('scrim').classList.remove('on'); return; } const k = sel; sel = null;
  $('drawer').classList.remove('on'); $('drawer').setAttribute('aria-hidden','true'); $('scrim').classList.remove('on');
  document.querySelector(`#uapp tr[data-k="${CSS.escape(k)}"]`)?.focus();
  if(!fromPop && location.hash) history.back();
}
$('umat').addEventListener('click', e=>{ const r = e.target.closest('tr[data-m]'); if(r && !e.target.closest('a')) openMatch(r.dataset.m); });
function openMatch(k){   // the package: why it fits, the demo link, the run-sheet, the VSL script (Architect 8687)
  const m = (UP.matches||[]).find(x=>x.key===k); if(!m) return; sel = null;
  const row = (t, v) => v ? `<dt>${t}</dt><dd>${v}</dd>` : '';
  $('d-co').textContent = m.title || m.key; $('d-role').textContent = `${m.statusWord} · owner: ${m.owner}`;
  $('d-body').innerHTML = `<h5>PACKAGE</h5><dl>${row('Job', `<a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.url.replace(/^https?:\/\/(www\.)?/,''))}</a>`)}${row('Posted', m.postedAt?esc(fmtT(m.postedAt)):'')}`+
    `${row('Demo', m.demo&&m.demo.url&&m.demo.ready?`<a href="${esc(m.demo.url)}" target="_blank" rel="noopener">${esc(m.demo.url)}</a>`:(m.demo&&m.demo.slug?'building: '+esc(m.demo.slug):'none'))}`+
    `${row('Run-sheet', m.runsheet?esc(m.runsheet):'')}${row('VSL', m.vsl?'recorded':m.vslScript?'script ready':'none')}${row('Note', esc(m.note||''))}</dl>`+
    ((m.why||[]).length?`<h5>WHY IT FITS</h5><ul>${m.why.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:'');
  $('drawer').classList.add('on'); $('drawer').setAttribute('aria-hidden','false'); $('scrim').classList.add('on'); $('drawer').scrollTop = 0;
}
$('uapp').addEventListener('click', e=>{ const r = e.target.closest('tr[data-k]'); if(r) openDrawer(r.dataset.k); });
$('uapp').addEventListener('keydown', e=>{ const r = e.target.closest('tr[data-k]'); if(r && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); openDrawer(r.dataset.k); } });
$('d-x').onclick = ()=>closeDrawer(); $('scrim').onclick = ()=>closeDrawer();
addEventListener('keydown', e=>{ if(e.key==='Escape') closeDrawer(); });
addEventListener('popstate', ()=>{ const h = decodeURIComponent(location.hash.slice(1)); if(h) openDrawer(h); else closeDrawer(true); });
let first = true;
async function loadUp(){ if(key!=='upwork') return; try{ const r = await fetch('/upwork.json?'+Date.now(),{cache:'no-store'}); if(r.ok) UP = await r.json(); }catch(e){} upwork();
  if(first && UP){ first = false; const h = decodeURIComponent(location.hash.slice(1)); if(h) openDrawer(h); } }
loadUp(); setInterval(loadUp, 60000); setInterval(()=>{ if(UP) matchRows(); }, 60000);


// knowledge#17952 (ask 3202): click the one-shot stage strip, or UPWORK ONE-SHOT in the header, to open the architecture
// diagram. It is drawn from /pipelines.json (KV `pipelines`, wi/registry/pipelines.yaml via feed.py), so a change to the
// pipeline reaches this page with no edit here. Missing feed = an honest empty state naming it.
// ARCH-RENDER-BEGIN (test_arch_replay.mjs extracts this block; keep it free of DOM access)
// Live state per stage: a registry stage that shares a name with a stage chip in /upwork.json `applied[].pipeline.stages`
// gets the count of rows past it and a stuck marker (SENT with no VSL). A stage with no feed says so, never a 0.
function archLive(UPd){
  const m = {}; if(!UPd || !Array.isArray(UPd.applied)) return m;
  for(const a of UPd.applied){ const p = a && a.pipeline; if(!p) continue;
    for(const s of (p.stages||[])){ const k = String(s.stage).toLowerCase(); const r = m[k] || (m[k] = {n:0, stuck:0});
      if(s.done) r.n++; if(s.stage==='SENT' && p.noVsl) r.stuck++; } }
  return m;
}
function archHtml(P, UPd, stage){
  if(!P || !(P.pipelines||[]).length) return '<h3>ONE-SHOT ARCHITECTURE</h3><p class="src">No pipelines feed yet: /pipelines.json is empty (source wi/registry/pipelines.yaml).</p>';
  const want = (stage||'').toLowerCase(), live = archLive(UPd);
  return P.pipelines.map(pl => `<h3>${esc(pl.title.toUpperCase())}</h3><p class="src">${pl.stages.length} stages · from ${esc(P.source||'pipelines.yaml')}</p><div class="flow">` +
    pl.stages.map(s => { const L = pl.id==='upwork' ? live[s.stage.toLowerCase()] : null;
      const st = L ? `<small class="live${L.stuck?' stuck':''}">live · ${L.n} jobs${L.stuck?` · STUCK ${L.stuck} (sent with no VSL)`:''}</small>` : '<small class="live none">no live feed for this stage</small>';
      return `<div class="box${want && s.stage.toLowerCase()===want?' hl':''}" data-stage="${esc(s.stage)}"><b>${esc(s.stage.toUpperCase())}</b><i>${esc(s.tool)}</i><small>owner · ${esc(s.owner)}</small><small>machine · ${esc(s.machine)}</small><small>hands off · ${esc(s.handoff)}</small>${st}</div>`; }).join('') + '</div>').join('');
}
// ARCH-RENDER-END
async function openArch(stage){
  const b = $('archb'); $('arch').hidden = false; b.innerHTML = '<p class="src">loading the architecture…</p>';
  let P = null; try{ const r = await fetch('/pipelines.json?'+Date.now(),{cache:'no-store'}); if(r.ok) P = await r.json(); }catch(e){}
  b.innerHTML = archHtml(P, UP, stage);
}
$('archx').onclick = () => { $('arch').hidden = true; };
document.addEventListener('keydown', e => { if(e.key==='Escape') $('arch').hidden = true; });
document.addEventListener('click', e => { const g = e.target.closest && e.target.closest('.stg'); if(g && !e.target.closest('a')){ const sg = e.target.closest('.sg'); openArch(sg ? sg.textContent.split(' · ')[0] : ''); } });
if(key==='upwork'){ const m = $('archbtn'); m.hidden = false; m.onclick = () => openArch(''); }
</script>
