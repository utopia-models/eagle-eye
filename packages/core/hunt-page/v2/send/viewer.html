<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{TITLE}}</title>
<meta property="og:title" content="{{TITLE}}">
<meta property="og:type" content="video.other">
<meta property="og:image" content="{{BASE}}poster.jpg">
<meta property="og:video" content="{{BASE}}video.mp4">
<meta name="twitter:card" content="player">
<!-- Layout copied from Loom's public share page (loom.com/share/56fde5f991b8490d9033dd226ebf3043, measured 2026-11-21 at
     1440 and 390): 60px white top bar with a hairline, logo left, filled #1868DB button right (radius 6, 36px); title
     24px/650 #292A2E ABOVE the player, sender row 14px #6B6E76 under it; player in a #F8F8F8 area, dark, 12px corners;
     the pill under the player (Loom's reactions/CTA row); a 435px white right panel with a left border; at phone width
     the player goes edge to edge with square corners and the panel drops below. Loom's "Get Loom free" -> "Book a call". -->
<style>
  :root { --ink: #292A2E; --sub: #6B6E76; --line: #DDDEE1; --blue: #1868DB; --blue-h: #1558BC; --area: #F8F8F8; --bg: #fff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Atlassian Sans", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  .bar { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
    border-bottom: 1px solid var(--line); background: #fff; position: sticky; top: 0; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 650; font-size: 20px; letter-spacing: -0.01em; }
  .brand .mark { width: 32px; height: 32px; border-radius: 8px; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 15px; font-weight: 700; }
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 6px; border: 0;
    background: var(--blue); color: #fff; font: 500 14px/1 inherit; font-family: inherit; text-decoration: none; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--blue-h); }
  .btn svg { width: 16px; height: 16px; }
  .wrap { display: flex; min-height: calc(100vh - 60px); }
  main { flex: 1; min-width: 0; }
  .head { padding: 16px 24px 18px; background: #fff; }
  h1 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 650; letter-spacing: -0.01em; }
  .meta { margin-top: 2px; font-size: 14px; color: var(--sub); }
  .meta b { font-weight: 500; color: var(--sub); }
  .area { background: var(--area); padding: 24px 32px 40px; }
  .player { position: relative; max-width: 1280px; aspect-ratio: 16 / 9; background: #1F1F21; border-radius: 12px; overflow: hidden; }
  video { width: 100%; height: 100%; display: block; background: #1F1F21; }
  .pill { margin: 24px auto 0; width: max-content; max-width: 100%; display: flex; align-items: center; gap: 14px; padding: 10px 12px 10px 20px;
    background: #fff; border: 1px solid var(--line); border-radius: 16px; font-size: 18px; font-weight: 500; }
  .pill .btn { height: 40px; font-size: 15px; padding: 0 16px; }
  aside { width: 435px; flex: none; border-left: 1px solid var(--line); background: #fff; }
  .tabs { display: flex; gap: 16px; padding: 0 24px; border-bottom: 1px solid var(--line); height: 50px; align-items: flex-end; }
  .tab { padding-bottom: 12px; font-size: 15px; color: var(--sub); }
  .tab.on { color: var(--blue); border-bottom: 2px solid var(--blue); padding-bottom: 10px; }
  .card { margin: 24px; padding: 20px; border: 1px solid var(--line); border-radius: 8px; }
  .who { display: flex; align-items: center; gap: 12px; }
  .av { width: 44px; height: 44px; border-radius: 50%; background: #E9F2FE; color: var(--blue); display: grid; place-items: center; font-weight: 650; }
  .who .n { font-weight: 650; font-size: 16px; }
  .who .r { font-size: 14px; color: var(--sub); margin-top: 2px; }
  .card .btn { width: 100%; justify-content: center; margin-top: 18px; height: 40px; }
  @media (max-width: 900px) {
    .wrap { display: block; }
    aside { width: auto; border-left: 0; border-top: 1px solid var(--line); }
    .area { padding: 0 0 24px; background: #fff; }
    .player { border-radius: 0; }
    .head { padding: 14px 16px; }
    h1 { font-size: 20px; line-height: 26px; }
    .pill { margin: 16px 16px 0; width: auto; justify-content: space-between; font-size: 16px; }
    .card { margin: 16px; }
    .bar .btn span { display: inline; }
  }
</style>
</head>
<body>
  <header class="bar">
    <a class="brand" href="https://utopiamodels.ai" rel="noopener"><span class="mark">U</span>Utopia Models</a>
    <a class="btn cta" href="{{CTA_URL}}" target="_blank" rel="noopener" data-cta="top"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/></svg><span>Book a call</span></a>
  </header>
  <div class="wrap">
    <main>
      <div class="head">
        <h1>{{TITLE}}</h1>
        <div class="meta"><b>{{SENDER}}</b> · <span id="ago" data-at="{{CREATED_AT}}">{{CREATED_HUMAN}}</span></div>
      </div>
      <div class="area">
        <div class="player">
          <video id="v" controls playsinline preload="metadata" poster="{{BASE}}poster.jpg">
            <source src="{{BASE}}video.mp4" type="video/mp4">
          </video>
        </div>
        <div class="pill">
          <span>{{PILL}}</span>
          <a class="btn cta" href="{{CTA_URL}}" target="_blank" rel="noopener" data-cta="pill">Book a call</a>
        </div>
      </div>
    </main>
    <aside>
      <div class="tabs"><span class="tab on">About</span></div>
      <div class="card">
        <div class="who">
          <div class="av">{{INITIALS}}</div>
          <div><div class="n">{{SENDER}}</div><div class="r">{{SENDER_ROLE}}</div></div>
        </div>
        <a class="btn cta" href="{{CTA_URL}}" target="_blank" rel="noopener" data-cta="panel">Book a call</a>
      </div>
    </aside>
  </div>
<script>
(function () {
  // Watch beacons -> /v/<slug>/e (the Eagle Eye API on Ra; the Cloudflare Worker forwards it in production).
  var E = "{{BEACON}}", v = document.getElementById("v"), sent = {}, c = null, sid;
  try { c = new URLSearchParams(location.search).get("c"); } catch (e) {}
  try { sid = sessionStorage.getItem("ee_sid"); } catch (e) {}
  if (!sid) { sid = Math.random().toString(36).slice(2, 12) + Date.now().toString(36); try { sessionStorage.setItem("ee_sid", sid); } catch (e) {} }
  function post(ev, pct) {
    var key = ev + ":" + (pct == null ? "" : pct);
    if (sent[key]) return; sent[key] = 1;
    var body = JSON.stringify({ e: ev, pct: pct, sid: sid, c: c, t: v && v.currentTime ? Math.round(v.currentTime * 10) / 10 : 0 });
    try { if (navigator.sendBeacon && navigator.sendBeacon(E, new Blob([body], { type: "text/plain" }))) return; } catch (e) {}
    try { fetch(E, { method: "POST", body: body, headers: { "content-type": "text/plain" }, keepalive: true }); } catch (e) {}
  }
  post("view", null);
  v.addEventListener("play", function () { post("play", 0); });
  v.addEventListener("timeupdate", function () {
    if (!v.duration || !isFinite(v.duration)) return;
    var p = v.currentTime / v.duration * 100;
    [25, 50, 75].forEach(function (m) { if (p >= m) post("progress", m); });
    if (p >= 98) post("progress", 100);
  });
  v.addEventListener("ended", function () { post("progress", 100); });
  // relative time, Loom-style ("2 hours ago")
  var a = document.getElementById("ago"), t = Date.parse(a.getAttribute("data-at"));
  if (t) { var s = (Date.now() - t) / 1000, u = [[60, "second"], [60, "minute"], [24, "hour"], [30, "day"], [12, "month"], [1e9, "year"]], n = s, i = 0;
    for (; i < u.length - 1 && n >= u[i][0]; i++) n /= u[i][0];
    n = Math.max(1, Math.floor(n)); a.textContent = n + " " + u[i][1] + (n > 1 ? "s" : "") + " ago"; }
})();
</script>
</body>
</html>
