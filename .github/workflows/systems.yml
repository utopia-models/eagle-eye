name: systems
on:
  pull_request:
    paths: ["systems/**", "packages/toolkit/**", "library/**", ".github/workflows/systems.yml"]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install pytest
      - name: every quoted line is in its cited file
        run: python3 packages/toolkit/quote_check.py
      - run: python3 -m pytest -q packages/toolkit/tests
