<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eagle Eye</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48"><link rel="icon" href="/favicon.svg?v=4" type="image/svg+xml"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<!-- ui-libraries: tailwind, shadcn (Badge/Button/Popover recipes), lucide icons, motion. List styling copied from Linear's issue list (Inter 13px, 1px dividers, quiet hover), rows taller per Tyler 11-21. -->
<link rel="stylesheet" href="/opt/tokens.css">
<link rel="stylesheet" href="/opt/shared.css">
<link rel="stylesheet" href="/opt/intro.css">
<link rel="stylesheet" href="/opt/detail.css">
<script src="/vendor/tailwind.js"></script>
<script src="/vendor/motion.js"></script>
<style type="text/tailwindcss">
@theme{
  /* every Tailwind color is an alias onto /opt/tokens.css; the default palette (green/orange/...) is switched off */
  --color-*:initial;
  --color-bg:var(--ink-1);--color-panel:var(--ink-2);--color-panel2:var(--ink-3);--color-gold:var(--gold-9);--color-pale:var(--gold-11);--color-ink:var(--ink-12);
  --color-mute:var(--ink-11);--color-dim:var(--ink-10);--color-line:var(--ink-6);--color-line2:var(--gold-6);--font-serif:Cormorant,Georgia,serif;--font-caps:Cinzel,serif;--font-mono:JBM,ui-monospace,monospace;--font-ui:Inter,system-ui,sans-serif;
}
</style>
<style>
@font-face{font-family:Inter;src:url(/fonts/Inter-var.woff2) format("woff2");font-weight:100 900;font-display:swap}
#bar,#list,.row-ui{font-family:Inter,system-ui,sans-serif;font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased}
/* row: Linear list metrics, two lines */
.hrow{position:relative;display:grid;grid-template-columns:170px 36px minmax(0,1fr) auto;align-items:center;column-gap:14px;min-height:78px;padding:10px 24px;
  border-bottom:1px solid var(--ink-5);cursor:pointer;transition:background .14s ease,transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s ease}
.hrow:hover{background:var(--gold-2);transform:translateY(-1px);box-shadow:0 6px 18px -10px var(--ink-1),inset 2px 0 0 var(--gold-9)}
.hrow:active{transform:translateY(0)}
/* type badge: the anchor of each row */
.tb{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px 0 8px;border-radius:7px;font:600 13px/1 Inter,sans-serif;letter-spacing:-.005em;white-space:nowrap;border:1px solid}
.tb .i{width:16px;height:16px;stroke-width:1.9}
/* hunt types: one hue, told apart by icon + shade (Funding solid · Job outline · Upwork tint) */
.tb.funding{color:var(--ink-1);background:var(--gold-11);border-color:var(--gold-11)}
.tb.job{color:var(--gold-11);background:transparent;border-color:var(--gold-9)}
.tb.upwork{color:var(--ink-12);background:var(--gold-3);border-color:var(--gold-6)}
.tb.investor{color:var(--gold-12);background:var(--gold-5);border-color:var(--gold-8)}
.tb.client,.tb.network{color:var(--ink-12);background:var(--ink-3);border-color:var(--ink-7)}
.sub{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;font:500 11.5px/1 Inter,sans-serif;color:var(--ink-11);background:var(--ink-3);border:1px solid var(--ink-6);white-space:nowrap}
.sub.closed{color:var(--ink-11);border:1px dashed var(--ink-8);background:transparent}
/* one-shot system (Tyler 11-22: "the one-shot system we're using should be within the row"): the .sub chip, outlined in the
   gold-owned bronze like .tb.job (badges are outlined, never solid); not started = the dashed .sub.closed look */
.oss{display:inline-flex;align-items:center;gap:5px;flex:0 1 auto;min-width:0;max-width:100%;align-self:center;height:20px;padding:0 7px;border-radius:5px;font:600 11.5px/1 Inter,sans-serif;color:var(--gold-11);background:transparent;border:1px solid var(--gold-8);white-space:nowrap}
.l1{flex-wrap:wrap;row-gap:4px}
.oss .i{width:12px;height:12px;stroke-width:1.9;flex:none}
/* TIMELINE, copied from GitHub Actions job steps (github.com/<repo>/actions/runs/<id>/job/<id>): a status icon per step (filled check =
   done, circle-slash = skipped, hollow circle = pending), the step name, the time in monospace. Horizontal in the row, the same
   vertical list at phone width. Eagle Eye tokens only. */
.tl{display:flex;align-items:center;gap:0;row-gap:6px;min-width:0;flex-wrap:wrap}
.tl .st{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font:500 12px/1 Inter,sans-serif;color:var(--ink-11)}
.tl .st .ic{width:14px;height:14px;flex:none;border-radius:50%;display:grid;place-items:center}
.tl .st.done .ic{background:var(--gold-9);color:var(--ink-1)}
.tl .st.done .ic svg{width:10px;height:10px;stroke-width:3}
.tl .st.skipped .ic{border:1.5px solid var(--ink-8);position:relative}
.tl .st.skipped .ic::after{content:"";position:absolute;width:9px;height:1.5px;background:var(--ink-8);transform:rotate(-45deg)}
.tl .st.pending .ic{border:1.5px solid var(--ink-7)}
.tl .st.pending,.tl .st.skipped{color:var(--ink-9)}
.tl .st time{font:400 11.5px/1 JBM,ui-monospace,monospace;color:var(--ink-10)}
.tl .st.done time{color:var(--gold-11)}
.tl .bar{flex:1 1 14px;min-width:10px;max-width:34px;height:1px;background:var(--ink-7);margin:0 8px}
.tl .bar.on{background:var(--gold-8)}
.tl .gap{display:inline-flex;align-items:center;gap:6px;margin:0 8px;font:400 11px/1 JBM,ui-monospace,monospace;color:var(--ink-10);white-space:nowrap}
.tl .gap::before,.tl .gap::after{content:"";width:10px;height:1px;background:var(--gold-8)}
.tl .gap.slow{color:var(--gold-11)}
.tl .st .dur{display:none;font:400 11px/1 JBM,ui-monospace,monospace;color:var(--ink-10);font-style:normal}
@media (max-width:760px){.tl{flex-direction:column;align-items:flex-start;gap:7px}.tl .bar,.tl .gap{display:none}.tl .st .dur{display:inline}}
.oss .k{font-weight:500;color:var(--ink-10);flex:none}
.oss.niche{color:var(--ink-12);border-color:var(--ink-7)}
.oss.none{font-weight:500;color:var(--ink-10);border:1px dashed var(--ink-7)}
.logo{width:32px;height:32px;border-radius:8px;object-fit:contain;background:var(--white);padding:3px;box-shadow:0 0 0 1px var(--gold-6)}
.tgt{font:600 14px/1.25 Inter,sans-serif;color:var(--ink-12);letter-spacing:-.01em}
.sig{font:400 13px/1.3 Inter,sans-serif;color:var(--ink-11)}
.meta{font:400 12px/1 Inter,sans-serif;color:var(--ink-10)}
.num{display:inline-flex;align-items:baseline;gap:4px;height:20px;padding:0 6px;border-radius:5px;background:var(--gold-2);box-shadow:inset 0 0 0 1px var(--gold-5);font:500 11.5px/20px Inter,sans-serif;color:var(--ink-10);white-space:nowrap}
.num b{font:600 12px/20px Inter,sans-serif;color:var(--gold-10);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;border:1px solid var(--ink-7);font:500 12px/1 Inter,sans-serif;color:var(--ink-11);white-space:nowrap}
.pill .i{width:14px;height:14px}
.pill.warn{color:var(--ink-11);border-style:dashed;border-color:var(--ink-8)}
.pill.ok{color:var(--gold-11);border-color:var(--gold-7);background:var(--gold-3)}
/* VSL stage: Record -> Recorded -> Sent, segments fill on paint */
.vsl{display:inline-flex;align-items:center;gap:8px;height:24px;padding:0 10px;border-radius:999px;border:1px solid var(--gold-8);font:600 12px/1 Inter,sans-serif;color:var(--gold-11);background:var(--gold-3)}
/* VSL stage = status by lightness/fill: Ready to record solid gold-9 · Recorded gold-11 tint · Sent gold-12 + glow */
.vsl.record{color:var(--ink-1);background:var(--gold-9);border-color:var(--gold-9)}
.vsl.record .seg i{background:color-mix(in srgb,var(--ink-1) 25%,transparent)}
.vsl.recorded{color:var(--gold-11);background:var(--gold-3);border-color:var(--gold-8)}
.vsl.sent{color:var(--gold-12);background:var(--gold-4);border-color:var(--gold-8);box-shadow:var(--glow)}
.vsl .seg{display:flex;gap:3px}.vsl .seg i{position:relative;display:block;width:14px;height:4px;border-radius:2px;background:var(--ink-7);overflow:hidden}
.vsl .seg i.on::after{content:"";position:absolute;inset:0;background:currentColor;transform-origin:left;animation:fill .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--n) * 140ms + 250ms)}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rep{display:inline-flex;align-items:center;gap:4px;min-width:34px;font:600 12px/1 Inter,sans-serif;font-variant-numeric:tabular-nums}
.rep .i{width:14px;height:14px}
.rep.has{color:var(--gold-11)}.rep.none{color:var(--ink-9)}
.ag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:5px;font:500 11px/1 Inter,sans-serif;color:var(--ink-10);background:var(--ink-3);text-transform:lowercase}
.ag .i{width:12px;height:12px}
.age{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:92px;text-align:right;font:500 12px/1 Inter,sans-serif;color:var(--ink-10);font-variant-numeric:tabular-nums}
.age .when{font:600 12.5px/1.2 Inter,sans-serif;color:var(--ink-12);white-space:nowrap}.age .when i{font-style:normal;font-weight:500;color:var(--ink-10)}
.age b{font:600 12px/1 Inter,sans-serif;color:var(--ink-10)!important;letter-spacing:-.01em;display:inline-flex;align-items:center;gap:5px}
.age b::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
/* speed-to-lead by lightness: hot = bright gold + ping, warm = ink-12, cold = ink-10 */
.spd-hot b{color:var(--gold-10)}.spd-warm b{color:var(--ink-12)}.spd-cold b{color:var(--ink-10)}
.spd-hot b::before{animation:ping 1.6s infinite}
/* fresh event: one gold sweep + a breathing edge */
.hrow.fresh::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--g);animation:breathe 2.4s ease-in-out infinite}
.hrow.fresh::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 30%,color-mix(in srgb,var(--gold-11) 9%,transparent) 50%,transparent 70%);background-size:250% 100%;animation:sweep 2.6s ease-in-out 1 .6s both}
@keyframes breathe{50%{opacity:.35}}
@keyframes sweep{from{background-position:120% 0}to{background-position:-120% 0}}
.dot-live{width:6px;height:6px;border-radius:50%;background:var(--gold-9);box-shadow:0 0 0 0 color-mix(in srgb,var(--gold-9) 60%,transparent);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.grp{display:flex;align-items:center;gap:10px;height:34px;padding:0 24px;background:var(--ink-2);border-bottom:1px solid var(--ink-5);font:600 12px/1 Inter,sans-serif;color:var(--ink-11)}
.grp .c{color:var(--ink-10);font-weight:500}
@media (prefers-reduced-motion:reduce){.hrow,.hrow:hover{transition:none;transform:none}.hrow.fresh::after,.hrow.fresh::before,.dot-live{animation:none}.vsl .seg i.on::after{animation:none}}
@media (max-width:1100px){.hrow{grid-template-columns:170px 32px minmax(0,1fr) auto;column-gap:10px;padding:10px 16px}.hide-md{display:none!important}}
@media (max-width:760px){.hrow{grid-template-columns:1fr;row-gap:8px}.hrow .logo{display:none}}
</style>
</head>
<body>
<script type="module" src="/opt/intro.js"></script>
<header class="top">
  <div class="brand"><img id="mark" src="/eye.png" alt="Eagle Eye"><div class="word"><b>EAGLE EYE</b><span>the networking machine</span></div></div>
  <nav class="tabs" role="tablist"><button data-tab="hunts" aria-selected="true">Hunts</button><button data-tab="roosts" aria-selected="false">Roosts</button></nav>
  
</header>
<div id="bar" class="sticky top-16 z-10 flex h-11 items-center gap-2 border-b border-line bg-bg/95 px-6 backdrop-blur"></div>
<main id="list" class="pb-24"></main>
<section id="page" class="page" hidden></section>

<script src="/opt/shared.js"></script>
<script src="/opt/detail.js"></script>
<script src="/opt/roosts.js"></script>
<script src="/opt/arch.js"></script>
<script>
const {esc, ago, day, exact, icon, ICON, TYPE_ALL, VSL, VSL_L, STATUS, F} = EE;
const cap = "font-caps text-[11px] tracking-[.24em] uppercase text-dim";
const chip = "inline-flex h-6 items-center gap-1.5 rounded-full border border-line px-2 text-[12px] text-mute whitespace-nowrap";
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------- row atoms ----------
const badge = r => `<span class="tb ${r.type}">${icon(ICON[r.type])}${esc(TYPE_ALL[r.type])}</span>`;
// every left chip says what it is (Tyler 5:15: "every remaining word must be a plain label")
const KNOWN = {Expert: "Level", Intermediate: "Level", Entry: "Level", "Entry level": "Level", Seed: "Round", "Pre-seed": "Round", "Series A": "Round",
  fund: "Investor kind", angel: "Investor kind", program: "Investor kind", unverified: "Check", LinkedIn: "Board"};
const FORMAT = /^(architecture page|terminal run|live demo|video \+ demo)$/i;   // the planned demo format: the Demo pill says what is built
const subLab = (r, s) => KNOWN[s] || (r.type === "funding" ? "Source" : r.type === "job" ? "Board" : null);
const subs = r => [...(r.subs || []).filter(s => !FORMAT.test(s)).map(s => `<span class="sub">${subLab(r, s) ? `<span style="color:var(--ink-9)">${esc(subLab(r, s))}:&nbsp;</span>` : ""}${esc(s)}</span>`), r.closed ? `<span class="sub closed">Closed</span>` : ""].join("");
const logo = r => r.logo ? `<img class="logo" src="${esc(r.logo)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : `<span></span>`;
const vsl = v => v ? `<span class="vsl ${v}" title="VSL stage"><span class="seg">${VSL.map((s, i) => `<i class="${i <= VSL.indexOf(v) ? "on" : ""}" style="--n:${i}"></i>`).join("")}</span>${VSL_L[v]}</span>` : "";
const one = o => o ? `<span class="pill max-w-full ${o.ok === false ? "warn" : o.ok ? "ok" : ""}" title="${esc(o.about || "One-shot: " + o.label)}">${icon(o.kind === "letter" ? "mail" : o.kind === "demo" ? "link" : "video")}<span class="truncate">${esc(o.label)}</span></span>` : "";
const replyN = r => r.repl && r.repl.length ? r.repl.length : r.replyCount;
const reply = r => { const n = replyN(r); return n == null ? "" : `<span class="rep ${n ? "has" : "none"}" title="Replies">${icon("reply")}${n}</span>`; };
const agents = r => [r.agent, r.front].filter(Boolean).map((a, i) => `<span class="ag" title="${i ? "front" : "back"}">${icon(i ? "video" : "bot")}${esc(a)}</span>`).join("");
// the one-shot system inside the channel: Intro VSL / Entire VSL · niche / Founder walkthrough ... ; null = not started
const OSS_I = {intro: "video", entire: "film", none: "link"};
// Tyler 11-22 ~4:55/5:00 AM MT: separate labelled parts, never one dotted string: "One-shot system: Upwork Intro VSL", "Niche: ..."
const ossName = (s=>String(s||'').replace(/\s+(entire|intro)\s+vsl\b.*$/i,'').replace(/\s+one-shot$/i,'').trim()||String(s||''));
const oss = r => !r.oss ? "" : r.oss.key
  ? `<a href="#" data-oss-system="${esc(r.oss.system)}" data-oss-row="${esc(JSON.stringify({...r.oss, target: r.target}))}" class="oss" title="Open the one-shot pipeline. "One-shot system: ${esc(r.oss.system)}${r.oss.about ? " (" + esc(r.oss.about) + ")" : ""}${r.oss.status === "placeholder" ? ", template not written yet" : ""}">${icon(OSS_I[r.oss.take] || "video")}<span class="k">One-shot system:</span><span class="truncate">${esc(ossName(r.oss.system))}</span></a>`
    + (r.oss.niche ? `<span class="oss niche" title="Niche: what this job is about"><span class="k">Niche:</span><span class="truncate">${esc(r.oss.niche)}</span></span>` : "")
  : `<a href="#" data-oss-system="Founder 14-Day Build" data-oss-row="${esc(JSON.stringify({...r.oss, target: r.target, system: "Founder 14-Day Build"}))}" class="oss" title="Open the one-shot pipeline"><span class="k">One-shot system:</span><span class="truncate">Founder 14-Day Build</span></a>`;
const nums = r => (r.nums || []).map(([k, v]) => `<span class="num"><b>${esc(v)}</b>${esc(k)}</span>`).join("");
let NEWEST = 0;
// signal time in the browser's zone + live minutes-ago with a speed-to-lead cue (bright gold < 60 min, ink-12 < 24 h, ink-10 after)
// the viewer's own zone, always labelled (Tyler 11-22 6:47 AM ET: follows him as he travels; never a bare unlabelled date)
const tz = EE.zone();
const hm = ts => new Date(ts).toLocaleString("en-US", {month: "short", day: "numeric", hour: "numeric", minute: "2-digit"});
const since = ts => { const m = Math.max(0, Math.round((Date.now() - Date.parse(ts)) / 60000)); return (m <= 120 ? m + " min" : m < 2880 ? Math.round(m / 60) + " h" : Math.round(m / 1440) + " d") + " ago"; };
const spd = ts => { const m = (Date.now() - Date.parse(ts)) / 60000; return m < 60 ? "spd-hot" : m < 1440 ? "spd-warm" : "spd-cold"; };
// "Posted Nov 21, 5:26 PM ET" (the viewer's zone) first, the relative age after it (investor rows: "Found")
const clock = (ts, kind = "Posted") => ts ? `<span class="age ${spd(ts)}" data-ts="${esc(ts)}" title="${esc(kind)} ${esc(hm(ts))} ${EE.zone(ts)}"><span class="when"><i>${esc(kind)}</i> ${hm(ts)} ${EE.zone(ts)}</span><b>${since(ts)}</b></span>` : `<span class="age"></span>`;
setInterval(() => document.querySelectorAll(".age[data-ts]").forEach(el => { const ts = el.dataset.ts; el.className = "age " + spd(ts); el.querySelector("b").textContent = since(ts); }), 30000);
const isFresh = r => r.ts && NEWEST - Date.parse(r.ts) < 30 * 60e3;

const ICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const SHORT = {posted: "Posted", built: "One-shot built", recorded: "Recorded", text: "Text proposal", vsl: "VSL proposal"};
const tShort = ts => new Date(ts).toLocaleString("en-US", {month: "short", day: "numeric", hour: "numeric", minute: "2-digit"});
const tClock = ts => new Date(ts).toLocaleString("en-US", {hour: "numeric", minute: "2-digit"});
const tDay = ts => new Date(ts).toLocaleDateString("en-US");
// elapsed time between two steps: "32 min", "3 h 33 min", "1 d 4 h"
const dur = (a, b) => { const m = Math.max(0, Math.round((Date.parse(b) - Date.parse(a)) / 60000)); if (m < 60) return m + " min";
  const h = Math.floor(m / 60), r = m % 60; return h < 24 ? h + " h" + (r ? " " + r + " min" : "") : Math.floor(h / 24) + " d" + (h % 24 ? " " + (h % 24) + " h" : ""); };
const tlHTML = r => {
  if (!r.tl?.steps) return "";
  const steps = r.type === "investor" ? [{key: "found", label: "Found", at: r.tl.primary.at, state: "done"}, ...r.tl.steps.slice(1)] : r.tl.steps;
  // a step on the same day as the step before it shows the clock only ("5:58 PM"); the date shows when it changes
  let prevAt = null, firstDay = null;
  const word = s => { if (s.state !== "done") return s.state === "done_no_time" ? "<time>time not recorded</time>" : s.state === "skipped" ? `<time>${s.key === "text" ? "not sent" : "none"}</time>` : "<time>pending</time>";
    const t = firstDay && tDay(s.at) === firstDay ? tClock(s.at) : tShort(s.at); firstDay = tDay(s.at); return `<time title="${esc(tShort(s.at))} ${EE.zone(s.at)}">${esc(t)}</time>`; };
  const st = s => s.state === "done_no_time" ? "done" : s.state;
  const parts = steps.map((s, i) => {
    // the gap before a step = time since the last step that has a time (a skipped step in between does not reset it)
    const g = s.state === "done" && prevAt ? dur(prevAt, s.at) : null, slow = g && Date.parse(s.at) - Date.parse(prevAt) > 60 * 60e3;
    const sep = i ? (g ? `<span class="gap ${slow ? "slow" : ""}" title="time from the previous step">${esc(g)}</span>` : `<span class="bar ${st(s) === "done" ? "on" : ""}"></span>`) : "";
    const out = `${sep}<span class="st ${st(s)}"><span class="ic">${st(s) === "done" ? ICK : ""}</span>${esc(SHORT[s.key] || s.label)}${word(s)}${g ? `<em class="dur">+${esc(g)}</em>` : ""}</span>`;
    if (s.state === "done") prevAt = s.at;
    return out;
  });
  return `<div class="tl" aria-label="Timeline, ${esc(Intl.DateTimeFormat().resolvedOptions().timeZone)}">${parts.join("")}<span class="meta" style="margin-left:10px">${EE.zone()}</span></div>`;
};
// Tyler 11-23: last 4 digits of the Upwork job id beside the Upwork pill, so he can match what agents call a job ("job 9263").
// r.job_tag is set by the API (eagle-eye-v2 src/feed.ts jobTag) on every Upwork row; null otherwise. Rendered, never derived here.
const jobTag = r => r.job_tag ? `<span class="meta" data-jobtag title="Upwork job id ends ${esc(r.job_tag)}" style="font:700 .95rem ui-monospace,monospace;border:1px solid var(--line,#444);border-radius:6px;padding:1px 7px">${esc(r.job_tag)}</span>` : "";
function rowHTML(r, view) {
  const line1Meta = [r.location, r.roleClass, r.kind, r.type === "client" || r.type === "network" ? r.stage : null].filter(Boolean).map(esc).join(" · ");
  return `<div data-row="${r.id}" class="hrow ${isFresh(r) ? "fresh" : ""}">
    <div class="flex min-w-0 flex-col items-start gap-1.5"><div class="flex items-center gap-1.5">${badge(r)}${jobTag(r)}</div>${(r.subs && r.subs.length) || r.closed ? `<div class="flex flex-wrap gap-1">${subs(r)}</div>` : ""}</div>
    ${logo(r)}
    <div class="flex min-w-0 flex-col gap-1.5">
      <div class="l1 flex min-w-0 items-baseline gap-2"><span class="tgt truncate">${esc(r.target)}</span>${oss(r)}${osClock(r)}${line1Meta ? `<span class="meta truncate">${line1Meta}</span>` : ""}</div>
      <div class="flex min-w-0 flex-wrap items-center gap-x-1.5 gap-y-1"><span class="sig truncate max-w-full">${esc(r.signal || "")}</span>${nums(r) ? `<span class="hide-md flex flex-wrap gap-1">${nums(r)}</span>` : ""}</div>
      ${r.oneshot ? `<div class="flex min-w-0">${one(r.oneshot)}</div>` : ""}
      ${tlHTML(r)}
    </div>
    ${r.paid || replyN(r) ? `<div class="flex items-center gap-2.5">${r.paid ? `<span class="pill">${esc(String(r.paid).split(" ·")[0])}</span>` : ""}${replyN(r) ? reply(r) : ""}</div>` : ""}
  </div>`;
}

// Tyler 2026-11-22 11:12Z, said twice: "within a four hour block, we need to do minimum four VSLs". The pace is on screen:
// VSLs SENT in the last 4 h (the timeline's "VSL proposal sent" step, from the ledger's vsl_sent fact; the old chip counted hand-RECORDED
// takes, so the automatic clone-voice intros never counted, 2026-11-24) against 4, and how many one-shots are built and waiting.
const PACE_N = 4, PACE_MS = 4 * 3600e3;
function vslPace() {
  const rows = EE.data?.rows || [], now = Date.now();
  const step = (r, k) => (r.tl?.steps || []).find(s => s.key === k);
  const rec = rows.filter(r => { const s = step(r, "vsl"); return s && s.at && now - Date.parse(s.at) < PACE_MS; }).length;
  const ready = rows.filter(r => r.status === "Ready to record").length;   // the recording queue = the status filter below
  // sprint 2.5: the fleet builds 20-30 ready one-shots a day; counted from the timeline's One-shot built step, last 24 h
  const built24 = rows.filter(r => { const s = step(r, "built"); return s && s.at && now - Date.parse(s.at) < 864e5; }).length;
  return {rec, ready, built24};
}
function paceChip() {
  const {rec, ready, built24} = vslPace(), ok = rec >= PACE_N;
  return `<span class="inline-flex h-7 items-center gap-1.5 rounded-md border px-2 text-[12.5px] ${ok ? "border-gold/60 text-pale" : "border-[#b4533c] text-[#e08a72]"}"
    data-pace="${rec}" title="Tyler: minimum ${PACE_N} VSLs in every 4-hour block">${icon("video", "!w-3.5 !h-3.5")}VSLs sent last 4 h: <b>${rec} of ${PACE_N}</b>
    <button data-f="status" data-v="Ready to record" data-queue="${ready}" title="the recording queue: every hunt whose one-shot is ready to record (click again to clear)"
      class="ml-1 rounded px-1 underline-offset-2 hover:underline ${F.status === "Ready to record" ? "text-pale" : "text-dim"}">· ${ready} ready to record ${F.status === "Ready to record" ? "(showing)" : "→"}</button>
    <span data-built="${built24}" title="sprint 2.5: the fleet builds 20-30 ready one-shots a day (One-shot built, last 24 h)" class="${built24 >= 20 ? "text-dim" : "text-[#e08a72]"}">· built 24 h: ${built24} of 20</span></span>`;
}
function renderBar(view) {
  if (view === "roosts") return window.EERoosts ? EERoosts.bar(EE.data?.roosts || []) : "";
  const on = Object.entries(F).filter(([k, v]) => v);
  const lab = {type: "Type", status: "Status", vsl: "VSL"};
  const val = (k, v) => k === "type" ? TYPE_ALL[v] : k === "vsl" ? (v === "none" ? "None" : VSL_L[v]) : v;
  const chips = on.map(([k, v]) => `<span class="inline-flex h-7 items-stretch overflow-hidden rounded-md border border-line text-[13px]">
    <span class="flex items-center gap-1.5 border-r border-line px-2 text-mute">${icon(k === "type" ? "job" : k === "vsl" ? "video" : "check", "!w-3.5 !h-3.5")}${lab[k]}</span>
    <span class="flex items-center border-r border-line px-2 text-dim">is</span>
    <span class="flex items-center px-2 text-ink">${esc(val(k, v))}</span>
    <button data-f="${k}" data-v="${v}" class="flex items-center border-l border-line px-1.5 text-dim hover:text-ink">${icon("x", "!w-3.5 !h-3.5")}</button></span>`).join("");
  const opt = (k, v, l, ic) => `<button data-f="${k}" data-v="${v}" class="flex w-full items-center gap-2 rounded px-2 py-1.5 text-left text-[13px] hover:bg-gold/10 ${F[k] === v ? "text-pale" : "text-mute"}">${ic ? icon(ic, "!w-3.5 !h-3.5") : ""}${l}${F[k] === v ? `<span class="ml-auto text-gold">${icon("check", "!w-3.5 !h-3.5")}</span>` : ""}</button>`;
  return `${chips}
  <div class="relative">
    <button data-pop="filter" class="inline-flex h-7 items-center gap-1.5 rounded-md px-2 text-[13px] text-mute hover:bg-gold/10">${icon("filter", "!w-3.5 !h-3.5")}Filter</button>
    <div data-popbody="filter" hidden class="absolute left-0 top-9 z-30 grid w-[520px] grid-cols-3 gap-3 rounded-lg border border-line2 bg-panel2 p-3 shadow-2xl">
      <div><div class="mb-1 px-2 text-[11px] font-semibold uppercase tracking-wide text-dim">Type</div>${opt("type", "job", "Job post", "job")}${opt("type", "upwork", "Upwork", "upwork")}${opt("type", "funding", "Funding", "funding")}${opt("type", "investor", "Investor", "investor")}</div>
      <div><div class="mb-1 px-2 text-[11px] font-semibold uppercase tracking-wide text-dim">Status</div>${STATUS.map(s => opt("status", s, s)).join("")}</div>
      <div><div class="mb-1 px-2 text-[11px] font-semibold uppercase tracking-wide text-dim">VSL</div>${VSL.map(s => opt("vsl", s, VSL_L[s], "video")).join("")}${opt("vsl", "none", "None")}</div>
    </div>
  </div>
  <span class="ml-auto inline-flex items-center gap-3">${paceChip()}<span class="inline-flex items-center gap-2 text-[12px] text-dim"><span class="dot-live"></span>${EE.data?.built ? "updated " + esc(exact(EE.data.built)) : ""}</span></span>`;
}

function renderList(view, rows) {
  if (view === "roosts" && window.EERoosts) return EERoosts.list(rows);
  NEWEST = Math.max(0, ...rows.map(r => r.ts ? Date.parse(r.ts) : 0));
  if (view === "hunts" && F.type === "job" && !rows.length) return `<div class="empty">${icon("job")}Starts tonight</div>`;
  if (view === "hunts" && F.type === "funding" && !rows.length) return `<div class="empty">${icon("funding")}Not running</div>`;
  if (!rows.length) return `<div class="empty">${icon("inbox")}No hunts</div>`;
  return rows.map(r => rowHTML(r, view)).join("");
}

// new rows from the 60 s poll: animate in at the top, never re-render the list
function addRows(view, rows) {
  const list = EE.$("#list"), M = window.Motion;
  rows.slice().reverse().forEach(r => {
    if (r.ts) NEWEST = Math.max(NEWEST, Date.parse(r.ts));
    const t = document.createElement("template"); t.innerHTML = rowHTML(r, view).trim();
    const el = t.content.firstChild; el.classList.add("fresh");
    list.prepend(el);
    if (M && !RM) M.animate(el, {opacity: [0, 1], y: [-16, 0], scale: [.985, 1]}, {duration: .45, easing: [.2, .8, .2, 1]});
  });
}

// ---------- detail: hands off to /opt/detail.js when present ----------
const sec = (title, ic, body) => `<section data-in class="mt-9"><h3 class="${cap} mb-3 flex items-center gap-2">${icon(ic, "!w-3.5 !h-3.5")}${title}</h3>${body}</section>`;
const prop = (k, v) => `<div class="flex min-h-9 items-center justify-between gap-3 text-[13px]"><span class="text-dim">${k}</span><span class="flex items-center gap-2 text-ink">${v}</span></div>`;
function renderDetail(r, nav) {
  if (window.EEDetail && typeof window.EEDetail.render === "function") return window.EEDetail.render(r, {nav, EE});
  const hunt = !!r.oneshot && r.type !== "job";
  const timeline = items => `<ol class="relative ml-2 border-l border-line">${items.map(s => `<li class="relative py-2 pl-6"><span class="absolute -left-[5px] top-[14px] h-[9px] w-[9px] rounded-full border border-gold bg-bg"></span>
      <div class="flex items-center gap-3 text-[14px]"><span class="text-ink">${esc(s.what)}</span>${s.ch ? `<span class="sub">${esc(s.ch)}</span>` : ""}<span class="ml-auto text-[12px] text-dim">${esc(exact(s.ts))}</span></div></li>`).join("")}</ol>`;
  return `<div class="row-ui flex h-12 items-center gap-3 border-b border-line px-6 text-[13px]">
      <button data-close class="flex items-center gap-1 text-mute hover:text-ink">${icon("left")}<span class="font-medium capitalize">${nav.view}</span></button>
      <span class="text-dim">›</span>${badge(r)}
      <span class="ml-auto text-[12px] text-dim">${nav.idx} / ${nav.n}</span>
      <button ${nav.prev ? `data-go="${nav.prev}"` : "disabled"} class="rounded border border-line p-1 text-mute disabled:opacity-30">${icon("up", "!w-3.5 !h-3.5")}</button>
      <button ${nav.next ? `data-go="${nav.next}"` : "disabled"} class="rounded border border-line p-1 text-mute disabled:opacity-30">${icon("down", "!w-3.5 !h-3.5")}</button>
    </div>
    <div class="row-ui grid min-h-[calc(100vh-112px)] grid-cols-[minmax(0,1fr)_340px]">
      <div class="px-16 py-10"><div class="max-w-[820px]">
        <div data-in class="flex items-center gap-4">${r.logo ? `<img class="logo !h-12 !w-12" src="${esc(r.logo)}" alt="">` : ""}<h1 class="font-serif text-[44px] font-medium leading-none text-pale">${esc(r.target)}</h1></div>
        <div data-in class="mt-4 flex flex-wrap items-center gap-2">${badge(r)}${subs(r)}${one(r.oneshot)}${vsl(r.vsl)}${reply(r)}</div>
        <div data-in class="mt-5 text-[15px] text-ink">${esc(r.signal || "")}</div>
        <div data-in class="mt-3 flex flex-wrap gap-1.5">${nums(r)}</div>
        ${r.sends && r.sends.length ? sec("Sends", "send", timeline(r.sends)) : ""}
        ${r.repl && r.repl.length ? sec("Replies", "reply", timeline(r.repl)) : ""}
        ${r.log && r.log.length ? sec("Activity", "bot", timeline(r.log.map(l => ({ts: l.ts, what: l.what, ch: l.who})))) : ""}
      </div></div>
      <aside class="border-l border-line px-6 py-8">
        <div data-in>${prop("Status", `<span class="sub">${esc(r.status || "")}</span>`)}${prop("Type", badge(r))}
          ${hunt && r.vsl ? prop("VSL", vsl(r.vsl)) : ""}${r.fit != null ? prop("Fit", `<b class="text-pale">${esc(r.fit)}</b>`) : ""}${replyN(r) != null ? prop("Replies", reply(r)) : ""}
          ${prop("Agents", agents(r))}${r.location ? prop("Location", esc(r.location)) : ""}${prop("Signal", r.ts ? hm(r.ts) + " " + esc(EE.zone(r.ts)) : "")}${r.found ? prop("Found", hm(r.found) + " " + esc(EE.zone(r.found))) : ""}${prop("Sent", r.sends && r.sends.length ? hm(r.sends[0].ts) + " " + esc(EE.zone(r.sends[0].ts)) : "—")}${r.ts ? prop("Since signal", `<span class="${spd(r.ts)} age !min-w-0"><b>${since(r.ts)}</b></span>`) : ""}
          ${r.url ? prop("Posting", `<a class="text-gold" target="_blank" href="${esc(r.url)}">${esc(new URL(r.url).host)}</a>`) : ""}</div>
      </aside>
    </div>`;
}

// ONE-SHOT SLA CLOCK (chief 11-22; Tyler 12:5x ET DECIDED: job posted -> one-shot BUILT within 10 MIN, red when exceeded).
// /oneshot/clocks.json = upwork's one-shot job records (published every 30 s by chief's oneshot-clocks timer); the clock starts when the
// fleet sees the job (`start`), stops at READY (`built`). Ticks every second in place; never re-renders the list.
let CLK = {target: 10, by: new Map()};
const clkKey = s => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
function clkFind(r) {
  if (r.type !== "upwork") return null;
  const id = (String(r.url || "").match(/~0\d{10,}/) || [])[0];
  return (id && CLK.by.get(id)) || CLK.by.get(clkKey(r.title)) || CLK.by.get(clkKey(r.signal)) || CLK.by.get(clkKey(r.target)) || null;
}
const mmss = ms => { const s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
// three stage clocks per job (Tyler 12:5x ET): BUILT within 10 min of the job being seen; RECORDING STARTED within 5 min of built;
// each REVISION under 5 min. One chip per stage that has started; red when exceeded; ticks in place.
function clkParts(j) {
  const now = Date.now(), M = 60000, st = j.start ? Date.parse(j.start) : null, out = [];
  const T = CLK.target * M, R = (CLK.rec || 5) * M, V = (CLK.rev || 5) * M;
  if (j.state === "blocked") out.push({k: "Built", t: "Blocked" + (st ? " " + mmss(now - st) : ""), red: true});
  else if (j.state === "skipped") out.push({k: "Built", t: "Skipped", red: false});
  else if (j.state === "ready" && j.built && st) out.push({k: "Built", t: mmss(Date.parse(j.built) - st) + " / " + CLK.target + ":00", red: Date.parse(j.built) - st > T});
  else if (st) out.push({k: "Built", t: mmss(now - st) + " / " + CLK.target + ":00", red: now - st > T});
  if (j.state === "ready" && j.built) {
    const b = Date.parse(j.built), rs = j.rec_start ? Date.parse(j.rec_start) : null;
    out.push(rs ? {k: "Rec started", t: mmss(rs - b) + " / " + (CLK.rec || 5) + ":00", red: rs - b > R}
                : {k: "Rec start", t: mmss(now - b) + " / " + (CLK.rec || 5) + ":00", red: now - b > R});
  }
  const rv = (j.revisions || []).filter(r => r.minutes != null);
  if (rv.length) { const last = rv[rv.length - 1]; out.push({k: "Revision " + rv.length, t: mmss(last.minutes * M) + " / " + (CLK.rev || 5) + ":00", red: last.minutes * M > V}); }
  return out;
}
function clkText(j) { const p = clkParts(j); return {t: p.map(x => x.k + " " + x.t).join(" · "), red: p.some(x => x.red), why: j.blocked_by}; }
function osClock(r) {
  if (r.tl?.vsl?.sent_at || r.vsl === "sent") return "";   // every clock stops at Sent (knowledge#18540): the hunt page's stage track carries the times
  const j = clkFind(r); if (!j) return "";
  return `<span class="inline-flex flex-wrap gap-1" data-clk="${esc(j.slug)}">${clkChips(j)}</span>`;
}
function clkChips(j) {
  return clkParts(j).map(x => `<span class="oss" style="${x.red ? "color:#e08a72;border-color:#b4533c" : ""}" title="One-shot SLA (Tyler 12:5x ET): built within ${CLK.target} min of the job being seen; recording started within ${CLK.rec || 5} min of built; a revision under ${CLK.rev || 5} min${j.blocked_by ? " · " + esc(j.blocked_by) : ""}">${icon("bot", "!w-3.5 !h-3.5")}<span class="k">${esc(x.k)}:</span><span>${esc(x.t)}</span></span>`).join("");
}
async function clkLoad() {
  try {
    const d = await fetch("/oneshot/clocks.json?" + Date.now(), {cache: "no-store"}).then(x => x.json());
    const by = new Map();
    (d.jobs || []).forEach(j => { if (j.job) by.set(j.job, j); if (j.title) by.set(clkKey(j.title), j); });
    const first = !CLK.by.size; CLK = {target: d.target_min || 10, rec: d.rec_min || 5, rev: d.rev_min || 5, by};
    if (first) document.querySelectorAll("[data-row]").forEach(el => { const r = (EE.data?.rows || []).find(x => x.id === el.dataset.row); const h = r && osClock(r); const l1 = el.querySelector(".l1"); if (h && l1 && !l1.querySelector("[data-clk]")) l1.querySelector(".tgt")?.insertAdjacentHTML("afterend", h); });
  } catch (e) {}
}
function clkTick() {
  document.querySelectorAll("[data-clk]").forEach(el => {
    let j = null; for (const v of CLK.by.values()) if (v.slug === el.dataset.clk) { j = v; break; }
    if (!j) return; const h = clkChips(j); if (el.innerHTML !== h) el.innerHTML = h;
  });
}
clkLoad(); setInterval(clkLoad, 30000); setInterval(clkTick, 1000);

EE.app({list: EE.$("#list"), bar: EE.$("#bar"), page: EE.$("#page"), renderList, renderBar, renderDetail, addRows, noIntro: true, poll: 60000});
</script>
</body>
