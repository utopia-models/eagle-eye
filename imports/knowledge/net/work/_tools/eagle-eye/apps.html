<style>
:root{--bg:#070706;--panel:#0d0c0a;--gold:#d9b35b;--pale:#f3dc9a;--ink:#e9dcc0;--dim:#a39778;--sand:#c9b88f;--line:rgba(217,179,91,.16);
  --hair:rgba(217,179,91,.08);--ok:#7fd49a;--okbg:rgba(127,212,154,.12);--warn:#d9a05b;--mute:#968b6e;
  --serif:"Cormorant Garamond",Georgia,serif;--caps:"Cinzel","Trajan Pro",Georgia,serif;--sans:"Inter",system-ui,sans-serif;
  --r:3px;--gut:16px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{min-height:100vh;overflow-x:hidden}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--pale);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) var(--gut) 72px}
@media (min-width:900px){:root{--gut:40px}}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;min-height:44px;font-family:var(--caps);text-decoration:none;color:var(--gold);letter-spacing:.34em;font-size:12px;padding:0 .2em 0 0}
.back:hover{color:var(--pale)}
.door{display:inline-flex;align-items:center;min-height:44px;font-family:var(--caps);font-size:11px;letter-spacing:.22em;color:var(--gold);text-decoration:none;border:1px solid var(--line);padding:.55em .9em;border-radius:var(--r)}
.door[hidden],.back[hidden]{display:none}   /* knowledge#14303: display:inline-flex beat the hidden attribute */
.door:hover{border-color:var(--gold);color:var(--pale)}
.strip{display:flex;align-items:center;gap:10px;min-height:44px}
.strip .back{letter-spacing:.2em;font-size:12px;color:var(--sand)}
.strip .back b{font-weight:400;color:var(--gold);font-size:16px;margin-right:.45em;letter-spacing:0}
h1{margin:0;font-family:var(--caps);font-weight:400;font-size:20px;letter-spacing:.16em;color:var(--pale);white-space:nowrap}
.who-sw{flex:0 0 auto;margin-left:auto;font-size:14px;min-height:44px;padding-top:6px;padding-bottom:6px}
.strip .door{margin-left:auto}.who-sw:not([hidden])+.door{margin-left:0}
.state{margin:0 0 0;font-size:13px;color:var(--dim);display:flex;align-items:center;gap:.5em;flex-wrap:wrap;min-height:22px}
.state .who{font-family:var(--caps);font-size:11px;letter-spacing:.2em;color:var(--sand)}
.state #since{color:var(--pale);font-variant-numeric:tabular-nums}.state #since.hot{color:var(--ok)}
@media (max-width:760px){.strip{gap:8px}.strip .back span,.strip .door .dk{display:none}.strip .back{min-width:44px;margin-left:-10px;justify-content:center}
  .strip .door{min-height:44px;padding:0 .7em;font-size:10px;letter-spacing:.16em;white-space:nowrap}.who-sw{min-height:44px;font-size:13px;padding:4px 26px 4px 9px}
  h1{font-size:17px;letter-spacing:.12em;overflow:hidden;text-overflow:ellipsis;min-width:0}}
.live{display:inline-flex;align-items:center;gap:.45em;font-family:var(--sans);font-size:12px;color:var(--dim)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.live.stale i{background:var(--warn);box-shadow:none}
/* the newest application, fully open: its record and its whole campaign (Tyler 2026-11-16) */
#latest{margin-top:14px}
.lsand{position:absolute;left:0;right:0;top:0;height:230px;z-index:0;pointer-events:none;opacity:.42;overflow:hidden;-webkit-mask-image:linear-gradient(#000 20%,transparent);mask-image:linear-gradient(#000 20%,transparent)}
.lsand canvas{width:100%!important;height:100%!important}
.lin{position:relative;z-index:1}
.lcard .co{text-shadow:0 0 28px rgba(217,179,91,.35)}
.lcard .cnote{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lcard .cstep{flex-wrap:wrap;row-gap:4px}.lcard .cstep i{white-space:normal;flex:1 1 9em}
.lcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);position:relative;overflow:hidden}
.lcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.lhead{padding:14px 16px 12px;border-bottom:1px solid var(--hair);display:grid;grid-template-columns:minmax(0,1fr);gap:3px;align-items:baseline}
.lk{grid-column:1/-1;font-family:var(--caps);font-size:10px;letter-spacing:.32em;color:var(--gold)}
.lhead .co{font-size:24px;white-space:normal}
.lhead .lrole{font-size:15px;color:var(--ink)}
.lhead .lst{font-size:12.5px;color:var(--sand)}.lhead .lst b{font-weight:500;color:var(--pale)}.lhead .lst .s{color:var(--gold)}
.lfacts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12.5px;color:var(--sand);align-items:center}
.lbody{padding:2px 16px 14px}
.lbody h5{margin:14px 0 8px;font-family:var(--caps);font-weight:400;font-size:10.5px;letter-spacing:.32em;color:var(--gold)}
.chain{grid-column:1/-1;position:relative;display:flex;justify-content:space-between;align-items:flex-start;margin:18px 0 6px;--r:0}
.cflow{position:absolute;left:0;right:0;top:-4px;height:30px;z-index:0;pointer-events:none;border-radius:15px;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(32px + (100% - 64px) * var(--r)),transparent calc(32px + (100% - 64px) * var(--r) + 46px));
  mask-image:linear-gradient(90deg,#000 calc(32px + (100% - 64px) * var(--r)),transparent calc(32px + (100% - 64px) * var(--r) + 46px))}
.cflow canvas{width:100%!important;height:100%!important}
.cflow::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(243,220,154,.18),transparent);mix-blend-mode:screen}
.ctrack{position:absolute;left:32px;right:32px;top:11px;height:1px;background:var(--line);z-index:0}
.chain [role=listitem]{position:relative;z-index:1;width:64px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;color:var(--dim);text-align:center;line-height:1.2}
.chain b{width:22px;height:22px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;background:var(--panel);font:600 11px/1 var(--sans);color:#120f08}
.chain .done b{background:radial-gradient(circle at 35% 35%,#fff3c9,var(--gold) 55%,#8a6a2a);border-color:var(--pale);box-shadow:0 0 14px rgba(243,220,154,.65)}.chain .done{color:var(--pale)}
.chain .now b{border-color:var(--pale);background:radial-gradient(circle,var(--pale) 0 26%,var(--panel) 30%);box-shadow:0 0 0 0 rgba(243,220,154,.7)}.chain .now{color:var(--pale)}
.chain .wait b{border:2px dashed var(--warn);background:var(--panel)}.chain .wait{color:var(--warn)}
.chain small{display:block;font-size:10.5px;color:var(--warn)}
.lmore{display:flex;justify-content:flex-end;padding:0 16px 14px}
.lmore button{min-height:44px;background:none;border:1px solid var(--line);border-radius:var(--r);color:var(--gold);font-family:var(--caps);font-size:10.5px;letter-spacing:.24em;padding:0 14px;cursor:pointer}
.lmore button:hover{border-color:var(--gold);color:var(--pale)}
@media (min-width:960px){.lcard .lin{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);grid-template-areas:"h b" "m b";grid-template-rows:auto 1fr}.lsand{right:60%;height:100%;-webkit-mask-image:radial-gradient(120% 90% at 0% 0%,#000 30%,transparent 75%);mask-image:radial-gradient(120% 90% at 0% 0%,#000 30%,transparent 75%)}
  .lhead{grid-area:h;border-bottom:0;padding:18px 20px 8px}.lbody{grid-area:b;border-left:1px solid var(--hair);padding:4px 20px 16px}
  .lmore{grid-area:m;justify-content:flex-start;align-items:flex-start;padding:0 20px 18px}.lhead .co{font-size:28px}}
section{margin-top:28px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h2{margin:0;font-family:var(--caps);font-weight:400;font-size:13px;letter-spacing:.42em;color:var(--gold)}
h2 em{font-variant-numeric:lining-nums;font-style:normal;font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:0;color:var(--pale);margin-right:.6em}
.sh small{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--dim)}
/* filters: role first, then company, tier, status */
.filters{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-bottom:12px}
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fl{font-family:var(--caps);font-size:10px;letter-spacing:.28em;color:var(--gold);min-width:4.2em}
.in{min-height:44px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;font-size:15px;min-width:0;flex:1 1 200px;color:var(--ink)}
.in::placeholder{color:var(--mute)}
select.in{flex:0 1 auto;appearance:none;-webkit-appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.chipset{display:flex;gap:8px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);padding-right:30px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;flex:1 1 100%}
.chipset::-webkit-scrollbar{display:none}
.ch{flex:0 0 auto;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--sand);cursor:pointer;white-space:nowrap;min-height:44px}
.ch small{color:var(--mute);margin-left:.35em;font-variant-numeric:tabular-nums}
.ch[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#120f08}
.ch[aria-pressed=true] small{color:#3a301a}
.ch:hover{border-color:var(--gold)}
.clear{background:none;border:0;color:var(--gold);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 2px;min-height:44px}
.clear[hidden]{display:none}
/* the inputs panel: fixed height, scrolls inside the page */
.panel{-webkit-mask-image:linear-gradient(#000 calc(100% - 26px),rgba(0,0,0,.25));mask-image:linear-gradient(#000 calc(100% - 26px),rgba(0,0,0,.25));position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);height:min(62vh,600px);overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.thead,.row{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.7fr) 9.4em 8.4em 6.4em 12em;gap:24px;align-items:center;padding:0 14px}
.thead{position:sticky;top:0;z-index:2;background:#11100c;border-bottom:1px solid var(--line);height:40px;white-space:nowrap;font-family:var(--caps);font-size:11.5px;letter-spacing:.24em;color:var(--gold)}
.row{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--hair);min-height:56px;cursor:pointer;color:inherit;position:relative}
.row:hover{background:rgba(217,179,91,.05)}
.row.sel{background:rgba(217,179,91,.09)}
.row.fresh::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.co{font-family:var(--serif);font-weight:600;font-size:18px;color:var(--pale);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role{font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role small{display:block;color:var(--mute);font-size:12px}
.tb{display:inline-block;font-family:var(--caps);font-size:9px;letter-spacing:.1em;padding:1px 5px;margin-left:6px;vertical-align:3px;border-radius:2px}
.t1{background:var(--gold);color:#120f08}.t2{border:1px solid var(--gold);color:var(--gold)}.t3{border:1px solid var(--mute);color:var(--sand)}
.tta{justify-self:start;font-size:12.5px;font-variant-numeric:tabular-nums;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--sand);white-space:nowrap}
.tta.ok{background:var(--okbg);border-color:rgba(127,212,154,.5);color:var(--ok)}
.wk{font-size:11px;padding:1px 6px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.wk-global-remote,.wk-contract{color:var(--ok);border-color:rgba(127,212,154,.5)}
.wk-unknown{color:var(--mute);border-style:dashed}
.tta.na{color:var(--mute);border-style:dashed}
.res{font-size:12.5px;color:var(--sand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when{font-size:12px;color:var(--dim);text-align:right;white-space:nowrap}
.st{font-size:11px;color:var(--gold);display:block}
.st.rej{color:var(--mute)}
/* knowledge#14131: every application row carries its VSL-sent state and its next action */
.nx{font-size:12.5px;color:var(--pale);white-space:normal;line-height:1.35}
.nx .vs{display:block;font-family:var(--caps);font-size:9.5px;letter-spacing:.18em;color:var(--mute)}
.nx .vs.on{color:var(--gold)}
.nx.dn{color:var(--dim);font-style:italic}
.ctab td.nxc{text-align:left;font-size:12px;white-space:normal}
.none{padding:40px 16px;text-align:center;font-family:var(--serif);font-style:italic;font-size:18px;color:var(--sand)}
.lend{margin:0;padding:14px;text-align:center;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--dim)}
.more{display:block;min-height:44px;margin:12px auto;background:none;border:1px solid var(--line);border-radius:var(--r);color:var(--gold);font-family:var(--caps);font-size:11px;letter-spacing:.24em;padding:10px 16px;cursor:pointer}
@media (max-width:760px){
  h2{letter-spacing:.24em;font-size:12px}.totals{gap:4px 16px}.t b{font-size:18px}.fl{min-width:0}
  .thead{display:none}
  .row{grid-template-columns:minmax(0,auto) minmax(0,1fr) auto;grid-template-areas:"co role when";gap:10px;padding:0 14px;min-height:48px}
  .row .co{grid-area:co;font-size:16px;max-width:46vw}.row .role{grid-area:role;color:var(--sand);font-size:13px}.row .when{grid-area:when;font-size:12px}
  .row .tta,.row .res,.row .nx,.row .when .st{display:none}
  .panel{height:auto;overflow:visible;-webkit-mask-image:none;mask-image:none}
  .lhead .co{font-size:22px}
}
/* outputs */
.out{display:grid;gap:28px;grid-template-columns:minmax(0,1fr)}
@media (min-width:960px){.out{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{margin:0 0 10px;font-family:var(--caps);font-weight:400;font-size:11px;letter-spacing:.32em;color:var(--pale);display:flex;justify-content:space-between;gap:10px}
.card h3 span{font-family:var(--serif);font-size:16px;letter-spacing:0;color:var(--gold)}
.sub{margin:0 0 18px}

.li .m{font-size:12.5px;color:var(--dim);text-align:right;white-space:nowrap}

.row.sweep{background:linear-gradient(100deg,transparent 0%,rgba(243,220,154,.22) 45%,transparent 70%) no-repeat;background-size:250% 100%}

a.cs{position:relative}a.cs::after{content:"";position:absolute;inset:-12px -8px}

details{margin-top:6px}

.ans{font-size:12.5px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 12px;padding:6px 0;border-top:1px solid var(--hair)}
.ans i{color:var(--dim);font-style:normal}
.foot{margin-top:40px;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--dim);line-height:1.5}
/* the live speed display + sand behind the header (Paper Shaders grainGradient) */

  -webkit-mask-image:linear-gradient(#000 35%,transparent);mask-image:linear-gradient(#000 35%,transparent)}
.sky canvas{width:100%!important;height:100%!important}
@media (max-width:760px){.sky{opacity:.5;height:200px}}
@media (min-width:761px){.sky{opacity:.48}}

.wrap{position:relative;z-index:1}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);flex:0 0 auto}
.live.stale .pulse{background:var(--warn);box-shadow:none}
.tabs{display:none}
.ftog{display:none}

  .tabs{display:grid;grid-template-columns:1fr 1fr;position:sticky;top:0;z-index:5;background:#070706;
    margin:20px calc(-1 * var(--gut)) 0;padding:8px var(--gut);border-bottom:1px solid var(--line)}
  .tab{min-height:44px;background:none;border:1px solid var(--line);color:var(--pale);font-family:var(--caps);font-size:11px;letter-spacing:.24em}
  .tab:first-child{border-radius:var(--r) 0 0 var(--r)}.tab:last-child{border-radius:0 var(--r) var(--r) 0;border-left:0}
  .tab[aria-selected=true]{background:var(--gold);border-color:var(--gold);color:#120f08}
  body[data-tab=out] #inputs,body[data-tab=in] #outputs{display:none}
  body[data-tab=cp] #inputs,body[data-tab=cp] #outputs,body[data-tab=in] #allcopy,body[data-tab=out] #allcopy{display:none}
  .ftog{display:block;min-height:44px;background:none;border:1px solid var(--line);border-radius:var(--r);color:var(--gold);font-family:var(--caps);font-size:11px;letter-spacing:.24em;padding:0 14px}
  .filters:not(.open) .fx{display:none}
  .role small{display:none}

}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
/* knowledge#14599: the referral copy as it leaves (read-only, knowledge#14694) */

.cpy .cbtns{display:flex;gap:8px;margin-top:6px}.cpy button{font:inherit;font-size:13px;padding:5px 12px;border-radius:6px;border:1px solid var(--gold);background:transparent;color:var(--gold);cursor:pointer}
.cpy button.ok{background:var(--gold);color:#000}.cpy .cmsg{font-size:12px;color:var(--mute);align-self:center}

<body data-tab="in">
<div class="sky" id="sky" aria-hidden="true"></div>
<div class="wrap">
  <div id="alert" role="status" aria-live="polite" hidden style="border:1px solid var(--gold);background:rgba(217,179,91,.1);color:var(--pale,#f3dc9a);padding:10px 14px;margin:0 0 10px;font-size:14px"></div>
  <header class="strip">
    <a class="back" href="/" aria-label="Eagle Eye"><b>&larr;</b><span>EAGLE EYE&nbsp;·</span></a>
    <h1>COLD APPS</h1>
    <button class="in" id="refresh" type="button" style="margin-left:auto;letter-spacing:.2em;font-size:12px;color:var(--gold);border-color:var(--gold);min-height:40px;padding:0 1.1em;cursor:pointer;background:transparent">REFRESH</button>
    <select class="in who-sw" id="who" aria-label="Whose applications" hidden></select>
    <a class="door" id="door" href="/view/cold-applications" target="desk-cold-apps" aria-label="Open Sekhmet's desk"><span class="dk">OPEN SEKHMET'S&nbsp;</span>DESK</a>
  </header>
  <p class="state" aria-live="polite"><span class="live" id="live"><span class="pulse" id="pulse"></span><span>loading</span></span><span>·</span><span class="who" id="whoname">sekhmet</span><span>·</span><span>last apply <b id="since" style="font-weight:500">–</b></span><span>·</span><span id="ivtile" title="interviews booked this ISO week (non-cancelled interview rows)">interviews booked this week <b id="iv-week" style="font-weight:500">–</b></span></p>

  <section id="latest" aria-labelledby="l-co" hidden><article class="lcard"><div class="lsand" id="l-sand" aria-hidden="true"></div><div class="lin" id="l-card"></div></article></section>

  <div class="tabs" role="tablist" aria-label="Section"><button class="tab" role="tab" id="t-in" aria-selected="true" aria-controls="inputs">APPLICATIONS</button><button class="tab" role="tab" id="t-out" aria-selected="false" aria-controls="outputs">TRACTION</button><button class="tab" role="tab" id="t-cp" aria-selected="false" aria-controls="allcopy">COPY</button></div>
  <section id="inputs" aria-labelledby="h-in">
    <div class="sh"><h2 id="h-in">EARLIER APPLICATIONS</h2><small id="count"></small></div>
    <div class="filters">
      <div class="frow"><span class="fl">ROLE</span><input class="in" id="f-role" type="search" placeholder="Search roles" autocomplete="off" aria-label="Search roles"><button class="ftog" id="ftog" aria-expanded="false">FILTER</button></div>
      <div class="frow"><div class="chipset" id="f-rt" role="group" aria-label="Role type"></div></div>
      <div class="frow fx"><span class="fl">COMPANY</span><input class="in" id="f-co" type="search" list="co-list" placeholder="Any company" autocomplete="off" aria-label="Company"><datalist id="co-list"></datalist></div>
      <div class="frow sel3 fx">
        <select class="in" id="f-tier" aria-label="Tier"><option value="">Tier</option><option value="1">Tier 1</option><option value="2">Tier 2</option><option value="3">Tier 3</option><option value="none">Not on the tier list</option></select>
        <select class="in" id="f-st" aria-label="Status"><option value="">Status</option><option value="submitted">Submitted</option><option value="submitted_unconfirmed">Submitted, unconfirmed</option><option value="answered">Company answered (not a rejection)</option><option value="rejection">Rejected</option></select>
        <select class="in" id="f-sla" aria-label="Speed"><option value="">Speed</option><option value="in">Under 5 min</option><option value="out">Over 5 min</option></select>
        <button class="clear" id="clear" hidden>Clear filters</button>
      </div>
    </div>
    <section id="facts" class="lcard" hidden aria-labelledby="h-facts" style="padding:14px 16px;margin-bottom:12px"></section>
    <div class="panel" id="panel" tabindex="0" aria-label="Applications, newest first">
      <div class="thead" aria-hidden="true"><span>COMPANY</span><span>ROLE</span><span>POST → APPLY</span><span>RESUME</span><span style="text-align:right">APPLIED</span><span>VSL · NEXT</span></div>
      <div id="rows"></div>
    </div>
  </section>

  <section id="outputs" aria-labelledby="h-out">
    <div class="sh"><h2 id="h-out">TRACTION</h2></div>
    <div class="out">
      <div>
        <div class="card sub" id="tr-iv"><h3>INTERVIEWS <span id="c-iv"></span></h3><div></div></div>
        <div class="card sub" id="tr-resp"><h3>COMPANIES THAT ANSWERED <span id="c-resp"></span></h3><div></div></div>
        <div class="card" id="tr-in"><h3>INBOUND <span id="c-in"></span></h3><div></div></div>
      </div>
      <div class="card" id="targets"><h3>TARGET COMPANIES BY TIER <span id="c-t"></span></h3><div></div></div>
    </div>
  </section>
  <section id="allcopy" aria-labelledby="h-cp">
    <div class="sh"><h2 id="h-cp">ALL COPY</h2><small id="cp-n"></small></div>
    <div id="cp-list"></div>
  </section>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-co" aria-hidden="true">
  <div class="dh"><div><div class="co" id="d-co"></div><div class="role" id="d-role"></div></div><button class="xbtn" id="d-x" aria-label="Close">&times;</button></div>
  <div class="db" id="d-body"></div>
</aside>

<script type="module">
import { animate, stagger } from 'https://cdn.jsdelivr.net/npm/motion@14.11.1/+esm';
import { ShaderMount, grainGradientFragmentShader, GrainGradientShapes, getShaderColorFromString, getShaderNoiseTexture, defaultPatternSizing, ShaderFitOptions } from 'https://cdn.jsdelivr.net/npm/@paper-design/shaders@0.0.82/+esm';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const PAGE = 120;
let D = null, ids = new Set(), shown = PAGE, sel = null, first = true, resumeUrl = {};
const F = {role:'', rt:'', co:'', tier:'', st:'', sla:''};
const NAMES = {tyler:'Tyler', osman:'Osman', claire:'Claire'};
let WHO = new URLSearchParams(location.search).get('p') || '';

// ---- formatting (12-hour local time, Tyler's rule)
const dtf = new Intl.DateTimeFormat(undefined, {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
const fmtT = iso => iso ? dtf.format(new Date(iso)) : '–';
function ago(iso){ if(!iso) return '–'; const s=(Date.now()-new Date(iso))/1000;
  if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+'m ago'; if(s<86400) return Math.floor(s/3600)+'h ago';
  if(s<86400*7) return Math.floor(s/86400)+'d ago'; return fmtT(iso).replace(/,.*$/,''); }
function dur(s){ if(s==null) return null; if(s<60) return s+'s'; if(s<3600) return Math.round(s/60)+' min';
  if(s<86400) return (s/3600).toFixed(s<36000?1:0)+' h'; return (s/86400).toFixed(s<864000?1:0)+' d'; }
function ttaBadge(a){ if(a.tta==null) return `<span class="tta na" >${a.pd?'date only':'–'}</span>`;
  return `<span class="tta ${a.tta<=D.sla_s?'ok':''}">${dur(a.tta)}</span>`; }
const rvLabel = v => !v ? 'Resume' : ({ai:'AI resume', master:'Master resume'})[v] || (v[0].toUpperCase()+v.slice(1)+' resume');
const tierB = t => t==null ? '' : `<span class="tb t${t}">T${t}</span>`;
function status(a){ const c=D.companies[a.k]; if(c&&c.stage&&c.stage_at&&a.at&&c.stage_at>=a.at) return c.stage; return a.out; }
// knowledge#14131: VSL-sent per company comes from /lanes.json (feed.py counts vsl_sent per company); the next action is
// a rule over the row's measured state: closed, interviewing, answered, or waiting/overdue for a follow-up (5 days).
// knowledge#14303: what the desk is waiting to be told (a person's page only: /lanes.json carries `facts` for them)
function renderFacts(f){ const el=$('#facts'); if(!el||!f||!(f.rows||[]).length){ if(el) el.hidden=true; return; }
  el.hidden=false; el.innerHTML=`<h3 id="h-facts" style="margin:0 0 8px;font-size:13px;letter-spacing:.08em">FACTS TO ASK YOU · your desk is stuck on these</h3>`+
    f.rows.slice(0,8).map(x=>`<div style="display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:3px 0"><span>${esc(x.fact)}</span><span title="postings blocked">${x.blocked} blocked</span></div>`).join(''); }
let VS = {};
async function loadVS(){ try{ const r=await fetch('/lanes.json?'+(WHO?'p='+encodeURIComponent(WHO)+'&':'')+Date.now(),{cache:'no-store'}); if(r.ok){ const l=await r.json(); renderFacts(l.facts); VS={}; for(const [k,c] of Object.entries(l.companies||{})) VS[k]=c.vsls||0; if(D){ renderLatest(); renderRows(); renderOutputs(); } } }catch(e){} }
function appNext(k, s, at){
  const c=(D.companies||{})[k]||{}, v=VS[k]||0, st=String(s||c.stage||'').toLowerCase();
  const age=at?(Date.now()-new Date(at))/864e5:0, due=at?new Date(new Date(at).getTime()+5*864e5).toLocaleDateString([], {month:'short',day:'numeric'}):'';
  if(/reject|cancel|declin|closed/.test(st)) return ['none: closed', true];
  if(/offer/.test(st)) return ['negotiate the offer', false];
  if(/interview|screen|assessment/.test(st)) return [`prep the ${st.split(/[^a-z]/)[0]}${v?'':' + send a VSL'}`, false];
  if((c.replies||[]).length) return [v?'book the call':'reply with a VSL', false];
  if(s==='submitted_unconfirmed') return ['confirm it went through', false];
  if(age>=5) return [v?'follow up':'follow up with a VSL to the hiring manager', false];
  return [`wait for a reply · follow up ${due}`, true];
}
const nxHtml = (k, s, at, tag) => { const v=VS[k]||0, [t,dim]=appNext(k, s, at);
  return `<${tag} class="nx${tag==='td'?' nxc':''}${dim?' dn':''}"><span class="vs${v?' on':''}">VSL ${v?'sent'+(v>1?' ×'+v:''):'not sent'}</span>${esc(t)}</${tag}>`; };
const stLabel = s => ({submitted:'submitted', submitted_unconfirmed:'unconfirmed'})[s] || s;

// ---- filters (URL-encoded so one link opens a filtered view)
function readURL(){ const q=new URLSearchParams(location.search); for(const k in F) F[k]=q.get(k)||''; WHO=q.get('p')||WHO; }
function writeURL(){ const q=new URLSearchParams(); if(WHO) q.set('p',WHO); for(const k in F) if(F[k]) q.set(k,F[k]);
  history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:'')+location.hash); }
function match(a, skip){
  if(skip!=='rt' && F.rt && a.rt!==F.rt) return false;
  if(F.role && !a.role.toLowerCase().includes(F.role.toLowerCase())) return false;
  if(F.co && !a.co.toLowerCase().includes(F.co.toLowerCase())) return false;
  const c=D.companies[a.k]||{};
  if(F.tier){ if(F.tier==='none' ? c.tier!=null : String(c.tier)!==F.tier) return false; }
  if(F.st){ const s=status(a); if(F.st==='answered'){ if(['submitted','submitted_unconfirmed','rejection'].includes(s)) return false; } else if(s!==F.st) return false; }
  if(F.sla==='in' && !(a.tta!=null && a.tta<=D.sla_s)) return false;
  if(F.sla==='out' && !(a.tta!=null && a.tta>D.sla_s)) return false;
  return true;
}
function syncControls(){ $('#f-role').value=F.role; $('#f-co').value=F.co; $('#f-tier').value=F.tier; $('#f-st').value=F.st; $('#f-sla').value=F.sla;
  $('#clear').hidden=!Object.values(F).some(Boolean);
  const nf=['co','tier','st','sla'].filter(k=>F[k]).length; $('#ftog').textContent=nf?`FILTER · ${nf}`:'FILTER'; if(nf) $('.filters').classList.add('open'); }
function renderRT(){
  const counts={}; for(const a of D.apps) if(match(a,'rt')) counts[a.rt]=(counts[a.rt]||0)+1;
  const types=Object.entries(counts).sort((x,y)=>y[1]-x[1]);
  if(F.rt && !counts[F.rt]) types.push([F.rt,0]);
  $('#f-rt').innerHTML=`<button class="ch" data-rt="" aria-pressed="${!F.rt}">All roles<small>${Object.values(counts).reduce((s,n)=>s+n,0)}</small></button>`+
    types.map(([t,n])=>`<button class="ch" data-rt="${esc(t)}" aria-pressed="${F.rt===t}">${esc(t)}<small>${n}</small></button>`).join('');
}

// ---- section 1: rows
function rowHtml(a){
  const c=D.companies[a.k]||{}, s=status(a);
  const res=`<span class="rdoc"><svg width="11" height="13" viewBox="0 0 11 13" aria-hidden="true"><path d="M1 .5h6l3 3v9H1z" fill="none" stroke="currentColor"/></svg>${esc(rvLabel(a.rv))}</span>`;
  return `<button class="row${sel===a.id?' sel':''}" data-id="${esc(a.id)}"><span class="co">${esc(a.co)}${tierB(c.tier)}</span>`+
    `<span class="role">${esc(a.role)}<small>${esc(a.rt)} · ${esc(a.ats||a.src)} · <span class="wk wk-${esc(a.wk||'unknown')}" title="work location, read from the post">${esc(a.wk||'unknown')}</span></small></span>${ttaBadge(a)}`+
    `<span class="res">${res}</span><span class="when">${ago(a.at)}<span class="st${s==='rejection'?' rej':''}">${esc(stLabel(s))}</span></span>${nxHtml(a.k, s, a.at, 'span')}</button>`;
}
const filtered=()=>Object.values(F).some(Boolean);
// replies and interview invites: an alert banner at the top (push is the Worker's cron; this is the same list on the page)
function renderAlert(){
  const hot=D.apps.filter(a=>{ const c=D.companies[a.k]||{}; return (c.replies||[]).length>0||/interview|screen|offer|assessment/.test(String(status(a))); });
  const el=$('#alert'); if(!el) return; el.hidden=!hot.length;
  el.innerHTML=hot.length?'<b>'+hot.length+(hot.length>1?' replies and invites':' reply or invite')+':</b> '+hot.slice(0,6).map(a=>esc(a.co)+' · '+esc(stLabel(status(a)))).join(' &nbsp;|&nbsp; '):'';
}
function renderRows(newIds){
  try{ renderAlert(); }catch(e){}
  const top=!filtered()&&D.apps[0]?D.apps[0].id:null;
  const list=D.apps.filter(a=>a.id!==top&&match(a));
  $('#h-in').lastChild.textContent=filtered()?'MATCHING APPLICATIONS':'EARLIER APPLICATIONS';
  $('#count').textContent = list.length.toLocaleString();
  const box=$('#rows');
  if(!list.length){ box.innerHTML=`<div class="none">No matches</div>`; return; }
  box.innerHTML=list.slice(0,shown).map(rowHtml).join('')+(list.length>shown?`<button class="more" id="more">SHOW ${Math.min(PAGE,list.length-shown)} MORE</button>`:`<p class="lend">That's every application</p>`);
  if(newIds&&newIds.size&&!RM){
    const els=[...box.querySelectorAll('.row')].filter(e=>newIds.has(e.dataset.id));
    els.forEach(e=>e.classList.add('fresh')); pulse();
    if(els.length) animate(els,{opacity:[0,1],y:[-28,0]},{type:'spring',bounce:.28,visualDuration:.55,delay:stagger(.06)});
    els.forEach(e=>{e.classList.add('sweep'); animate(e,{backgroundPosition:['120% 0','-60% 0']},{duration:1.6,ease:'easeOut',delay:.25}).then(()=>e.classList.remove('sweep'));});
  }
}

// ---- section 2: outputs
function renderOutputs(){
  const T=D.traction;
  const iv=T.interviews;
  $('#c-iv').textContent=iv.length;
  $('#tr-iv > div').innerHTML = iv.length ? iv.map(v=>`<div class="li click" data-co="${esc(v.co)}"><span class="n">${esc(v.co)}</span><span class="m">${fmtT(v.start)}</span>`+
    `<span class="x">${esc(v.stage||'')} · ${esc(v.status||'')}${v.outcome?' · '+esc(v.outcome):''}<br><span class="via">via ${esc(v.via)}</span></span></div>`).join('')
    : `<p class="muted">None</p>`;
  const resp=T.responded, good=resp.filter(r=>r.stage!=='rejection'), rej=resp.length-good.length;
  $('#c-resp').textContent=`${good.length} · ${rej} rejections`;
  $('#tr-resp > div').innerHTML=(good.length?good.slice(0,14).map(r=>`<div class="li click" data-co="${esc(r.co)}"><span class="n">${esc(r.co)}${tierB(r.tier)}</span><span class="m">${ago(r.at)}</span>`+
    `<span class="x">${esc(r.stage)} <span class="via">via ${esc(r.via)}</span></span></div>`).join(''):`<p class="muted">None</p>`)+
    (rej?`<details><summary>${rej} rejections</summary>${resp.filter(r=>r.stage==='rejection').slice(0,40).map(r=>`<div class="li click" data-co="${esc(r.co)}"><span class="n">${esc(r.co)}</span><span class="m">${ago(r.at)}</span></div>`).join('')}</details>`:'');
  const inb=T.inbound;
  $('#c-in').textContent=inb.length;
  $('#tr-in > div').innerHTML = inb.length ? inb.slice(0,10).map(r=>`<div class="li click" data-co="${esc(r.co)}"><span class="n">${esc(r.co||r.from)}</span><span class="m">${ago(r.at)}</span>`+
    `<span class="x"><span class="q">${esc(r.snippet)}</span><span class="via">via ${esc(r.via)}</span></span></div>`).join('') : `<p class="muted">None</p>`;
  // right: target companies by tier
  const C=D.companies, byTier={};
  for(const t of D.tiers){ (byTier[t.tier]=byTier[t.tier]||[]).push({...(C[t.k]||{name:t.name,apps:0,emails:[],roles:[],stage:null}), k:t.k, name:(C[t.k]||{}).name||t.name}); }
  const tierKeys=new Set(D.tiers.map(t=>t.k));

  try{ SH.setSpeed(v.speed); SH.setUniforms({u_intensity:v.intensity}); }catch(e){} }
function pulse(){ burstUntil=Date.now()+1600; if(D&&D.apps.length) sand(Math.floor((Date.now()-new Date(D.apps[0].at))/1000)); if(RM) return; animate('#pulse',{boxShadow:['0 0 0 0 rgba(127,212,154,.7)','0 0 0 14px rgba(127,212,154,0)'],scale:[1.5,1]},{duration:1.1,ease:'easeOut'}); }
function renderTotals(){ tick(); const n=D.totals&&D.totals.interviews_booked_week; $('#iv-week').textContent=n==null?'–':n; $('#ivtile').dataset.n=n==null?'':n; }
function renderLive(){ const el=$('#live'), age=(Date.now()-new Date(D.updated))/1000;
  el.classList.toggle('stale',age>180); el.querySelector('span:last-child').textContent=age>180?'paused':'live'; }

// ---- data
async function load(){
  try{
    const r=await fetch('/apps.json?'+(WHO?'p='+encodeURIComponent(WHO)+'&':'')+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json(); if(!d.apps) throw new Error(d.reason||'no applications in the feed yet');
    const fresh=new Set(); if(!first) for(const a of d.apps) if(!ids.has(a.id)) fresh.add(a.id);
    D=d; ids=new Set(d.apps.map(a=>a.id)); resumeUrl={}; for(const v of Object.values(d.resumes)) if(v.v) resumeUrl[v.v]=v.url;
    if(first){ $('#co-list').innerHTML=[...new Set(d.apps.map(a=>a.co))].sort().map(c=>`<option value="${esc(c)}">`).join(''); }
    renderTotals(); renderLatest(); renderRT(); renderRows(fresh); renderOutputs(); renderLive(); if(first){ loadVS(); setInterval(loadVS, 300000); }
    if(first){ first=false; syncControls(); if(location.hash.length>1){ setTab('in'); openDrawer(decodeURIComponent(location.hash.slice(1))); }
      if(!RM) animate('section',{opacity:[0,1],y:[14,0]},{duration:.5,delay:stagger(.08)}); }
  }catch(e){ $('#live').classList.add('stale'); $('#live span:last-child').textContent='offline';
    if(first) $('#rows').innerHTML=`<div class="none">Offline</div>`; }
}

// ---- events
function refilter(){ shown=PAGE; writeURL(); syncControls(); renderRT(); renderRows(); }
let tmo; const deb=fn=>{clearTimeout(tmo);tmo=setTimeout(fn,160)};
$('#f-role').addEventListener('input',e=>{F.role=e.target.value.trim(); deb(refilter);});
$('#f-co').addEventListener('input',e=>{F.co=e.target.value.trim(); deb(refilter);});
for(const [id,k] of [['f-tier','tier'],['f-st','st'],['f-sla','sla']]) $('#'+id).addEventListener('change',e=>{F[k]=e.target.value; refilter();});
$('#f-rt').addEventListener('click',e=>{const b=e.target.closest('.ch'); if(!b) return; F.rt=b.dataset.rt; refilter();});
$('#ftog').addEventListener('click',()=>{ const o=$('.filters').classList.toggle('open'); $('#ftog').setAttribute('aria-expanded',o); });
$('#clear').addEventListener('click',()=>{for(const k in F) F[k]=''; refilter();});
$('#rows').addEventListener('click',e=>{ if(e.target.id==='more'){ shown+=PAGE; renderRows(); return; } const r=e.target.closest('.row'); if(r) openDrawer(r.dataset.id); });
$('#d-body').addEventListener('click',e=>{const t=e.target.closest('[data-id]'); if(t) openDrawer(t.dataset.id);});
$('#outputs').addEventListener('click',e=>{const t=e.target.closest('[data-co]'); if(!t) return;
  for(const k in F) F[k]=''; F.co=t.dataset.co; setTab('in'); refilter(); $('.tabs').offsetParent&&jump('in'); $('#inputs').scrollIntoView({behavior:RM?'auto':'smooth',block:'start'}); });
$('#d-x').addEventListener('click',()=>closeDrawer()); $('#scrim').addEventListener('click',()=>closeDrawer());
addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });
addEventListener('popstate',()=>{ readURL(); syncControls(); if(D){ renderRT(); renderRows(); } if(location.hash.length>1) openDrawer(decodeURIComponent(location.hash.slice(1))); else closeDrawer(true); });
function setTab(t){ document.body.dataset.tab=t; $('#t-out').setAttribute('aria-selected',t==='out'); $('#t-in').setAttribute('aria-selected',t==='in'); $('#t-cp').setAttribute('aria-selected',t==='cp'); if(t==='cp') renderCopy(); }
// knowledge#14672: every outbound text, every campaign, sent or queued, exactly as written (read-only; nobody approves it)
function renderCopy(){ const cp=(D&&D.copy)||[]; $('#cp-n').textContent=cp.length+' texts';
  $('#cp-list').innerHTML=cp.length?cp.map(x=>`<div class="cpy"><div class="cstep"><i><b>${esc(x.name)}</b> · ${esc(x.co)} · ${esc(x.channel)} · ${esc(REL[x.relationship]||x.relationship||'')}${x.role?' · '+esc(x.role):''}${x.at?' · '+esc(fmtT(x.at)):''}</i><span class="cs ${STC[x.state]||'cs-wait'}">${esc(x.state)}</span></div><textarea readonly aria-label="Text to ${esc(x.name)}">${esc(x.text)}</textarea></div>`).join(''):'<p class="muted">No outbound text written yet</p>'; }
const jump=t=>{ setTab(t); const y=$('.tabs').getBoundingClientRect().top; if(y<0||y>innerHeight*.5) $('.tabs').scrollIntoView({block:'start',behavior:RM?'auto':'smooth'}); };
$('#t-out').addEventListener('click',()=>jump('out')); $('#t-in').addEventListener('click',()=>jump('in')); $('#t-cp').addEventListener('click',()=>jump('cp'));
setInterval(tick,1000);
try{ // sand behind the header, the home eye's gold family (Paper Shaders grainGradient); static under reduced motion
  const S=defaultPatternSizing, C=c=>getShaderColorFromString(c);
  const noise=getShaderNoiseTexture?.();
  const mount=()=>{ SH=new ShaderMount($('#sky'), grainGradientFragmentShader, {
    u_colorBack:C('#070706'), u_colors:['#3a2c10','#8a6a2a','#d9b35b','#1a140a'].map(C), u_colorsCount:4,
    u_softness:.8, u_intensity:.25, u_noise:.5, u_shape:GrainGradientShapes.wave, ...(noise?{u_noiseTexture:noise}:{}),
    u_fit:ShaderFitOptions[S.fit], u_scale:S.scale, u_rotation:S.rotation, u_originX:S.originX, u_originY:S.originY,
    u_offsetX:S.offsetX, u_offsetY:S.offsetY, u_worldWidth:S.worldWidth, u_worldHeight:S.worldHeight}, undefined, RM?0:.35, 0, 1, 520000); };
  const LOOK={card:{back:'#0d0c0a',cols:['#5a4318','#b88a35','#f3dc9a','#1a140a'],soft:.7,int:.42,speed:.6},
              flow:{back:'#0d0c0a',cols:['#8a6a2a','#f3dc9a','#fff3c9','#d9b35b'],soft:.5,int:.65,speed:2.2}};
  mkSand=(el,kind)=>{ if(!el) return null; const L=LOOK[kind]; try{ return new ShaderMount(el, grainGradientFragmentShader, {
    u_colorBack:C(L.back), u_colors:L.cols.map(C), u_colorsCount:4, u_softness:L.soft, u_intensity:L.int, u_noise:.6,
    u_shape:kind==='flow'?GrainGradientShapes.wave:(GrainGradientShapes.ripple??GrainGradientShapes.wave), ...(noise?{u_noiseTexture:noise}:{}),
    u_fit:ShaderFitOptions[S.fit], u_scale:S.scale, u_rotation:S.rotation, u_originX:S.originX, u_originY:S.originY,
    u_offsetX:S.offsetX, u_offsetY:S.offsetY, u_worldWidth:S.worldWidth, u_worldHeight:S.worldHeight}, undefined, RM?0:L.speed, 0, 1, 300000); }catch(e){ console.warn('sand off:', e.message); return null; } };
  const both=()=>{ mount(); mkSand($('#l-sand'),'card'); if(!FLOW&&$('#l-flow')) FLOW=mkSand($('#l-flow'),'flow'); };
  if(noise && !noise.complete) noise.addEventListener('load',both,{once:true}); else both();
}catch(e){ console.warn('sand shader off:', e.message); }
readURL();
fetch('/me.json',{cache:'no-store'}).then(r=>r.json()).then(m=>{ if(!WHO) WHO=m.view||m.me; const sw=$('#who');
  if(m.people.length>1){ sw.innerHTML=m.people.map(p=>`<option value="${p}"${p===WHO?' selected':''}>${NAMES[p]||p}</option>`).join(''); sw.hidden=false; }
  if(WHO!=='tyler') $('#whoname').textContent=NAMES[WHO]||WHO;
  document.querySelector('#door').hidden = m.people.length===1 || WHO!=='tyler';   // Claire or Osman: Sekhmet's desk is Tyler's; the back link is their own home
}).catch(()=>{});
$('#who').addEventListener('change',e=>{ WHO=e.target.value; $('#whoname').textContent=WHO==='tyler'?'sekhmet':(NAMES[WHO]||WHO); $('#door').hidden=WHO!=='tyler'; for(const k in F) F[k]=''; first=true; ids=new Set(); shown=PAGE; writeURL(); syncControls(); load(); });
$('#refresh').onclick=()=>location.reload();
load(); setInterval(load,30000); setInterval(()=>D&&renderLive(),15000);
</script>
</body>
</html>
