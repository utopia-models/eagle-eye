# Vale config for spoken VSL scripts (script_check.py --copy runs it on the extracted spoken text).
# Packages are downloaded, never committed: `vale --config vale/.vale.ini sync` (Google, Microsoft, write-good, proselint, alex).
# Spoken/ is ours and committed. First person, "we", contractions and E-Prime are WRONG for a script read aloud, so they are off.
StylesPath = styles
MinAlertLevel = warning
Packages = Google, Microsoft, write-good, proselint, alex

[*.md]
BasedOnStyles = Spoken, Google, Microsoft, write-good, proselint, alex
Google.FirstPerson = NO
Google.We = NO
Google.Will = NO
Google.Contractions = NO
Google.Headings = NO
Google.Colons = NO
Google.Parens = NO
Google.Acronyms = NO
Google.WordList = NO
Google.Spelling = NO
Google.EmDash = NO
Google.OxfordComma = NO
Google.Semicolons = NO
Google.Quotes = NO
Google.Units = NO
Google.Latin = NO
Google.Exclamation = NO
Microsoft.FirstPerson = NO
Microsoft.We = NO
Microsoft.Contractions = NO
Microsoft.Headings = NO
Microsoft.HeadingAcronyms = NO
Microsoft.Acronyms = NO
Microsoft.Quotes = NO
Microsoft.Vocab = NO
Microsoft.Spacing = NO
Microsoft.GeneralURL = NO
Microsoft.Auto = NO
Microsoft.Avoid = NO
Microsoft.Terms = NO
Microsoft.Foreign = NO
Microsoft.Ordinal = NO
Microsoft.Dashes = NO
Microsoft.SentenceLength = NO
Microsoft.RangeFormat = NO
Microsoft.Semicolon = NO
Microsoft.Plurals = NO
Microsoft.Parens = NO
write-good.E-Prime = NO
write-good.So = NO
write-good.TooWordy = YES
alex.ProfanityLikely = NO
alex.ProfanityMaybe = NO
alex.ProfanityUnlikely = NO
