<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eagle Eye · Studio</title>
<!-- knowledge#14747: the Studio panel. Read only: every VSL from Kitsu (studio.utopiamodels.ai), as `vsl studio feed`
     prints it on Ra; push-kv.sh joins it into KV `lanes` as `.studio`, so this page reads /lanes.json. Writes go
     through horus's `vsl` verbs, never this page. -->
<style>
:root{--bg:#0a0a09;--fg:#e9e6df;--dim:#8c877c;--line:#24221e;--acc:#e8b04a;--ok:#7bc47f;--bad:#e06c5a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;padding:20px 28px 12px;border-bottom:1px solid var(--line)}
header b{letter-spacing:.14em;font-size:12px;color:var(--acc)}header h1{margin:0;font-size:26px;font-weight:600}
header a,main a{color:var(--acc);text-decoration:none}header .r{margin-left:auto;color:var(--dim);font-size:13px}
main{padding:8px 28px 48px;max-width:1500px}
.client{border-bottom:1px solid var(--line);padding:18px 0}
.client h2{margin:0 0 4px;font-size:20px}.client h2 small{color:var(--dim);font-weight:400;font-size:13px;margin-left:10px}
.video{display:grid;grid-template-columns:minmax(260px,1fr) minmax(280px,1.1fr) minmax(320px,1.6fr);gap:22px;margin-top:10px}
@media (max-width:1000px){.video{grid-template-columns:1fr}}
h3{margin:6px 0 6px;font-size:11px;letter-spacing:.14em;color:var(--dim);font-weight:600}
.pill{display:inline-block;padding:1px 8px;border-radius:9px;border:1px solid var(--line);font-size:12px;margin:0 6px 4px 0;color:var(--dim)}
.pill.wfa{color:var(--acc);border-color:#5a4520}.pill.done{color:var(--ok);border-color:#2f4a31}.pill.retake{color:var(--bad);border-color:#5a2c25}.pill.wip{color:var(--fg)}
table{border-collapse:collapse;width:100%}td{padding:5px 8px 5px 0;vertical-align:top;border-top:1px solid var(--line);font-size:14px}
td.n{color:var(--acc);font-weight:600;white-space:nowrap;width:1%}td.t{color:var(--dim);white-space:nowrap;width:1%;font-size:12px}
.score{font-size:30px;font-weight:600}.score small{font-size:12px;color:var(--dim);font-weight:400;margin-left:6px}
.note{padding:6px 0;border-top:1px solid var(--line);font-size:14px}.note .by{color:var(--acc);font-weight:600;margin-right:6px}
.note .at{color:var(--dim);font-size:12px;margin-left:6px}.tc{font-family:ui-monospace,monospace;font-size:12px;color:var(--bg);background:var(--acc);border-radius:4px;padding:0 5px;margin-right:4px}
.deliv{color:var(--ok)}.empty{color:var(--dim);padding:40px 0;font-size:16px}
.rv{color:var(--dim);font-size:12px}
</style>
</head>
<body>
<header><b>EAGLE EYE · STUDIO</b><h1>Every VSL</h1><a id="open" href="https://studio.utopiamodels.ai">open Kitsu</a><span class="r" id="upd"></span></header>
<main id="main"><div class="empty">Loading the studio…</div></main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Kitsu stores times as UTC without a zone
const T=ts=>ts?new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(ts)?ts:ts+'Z'):null;
const when=ts=>{const d=T(ts);if(!d)return '';return d.toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});};
// Kitsu's own timecode ("v3 00:01:12:05 (2166)") shown as a chip
const TC=/v(\d+) (\d+:)?(\d+):(\d+)(\.|:)(\d+) \((\d+)\)/g;
const txt=s=>esc(s).replace(TC,m=>`<span class="tc">${m}</span>`);
const STATUS={todo:'to do',wip:'in progress',wfa:'waiting for approval',retake:'retake',done:'done'};
function video(c,v){
  const tasks=['Script','Record','Review'].map(k=>`<span class="pill ${esc(v.tasks[k]||'')}">${k}: ${esc(STATUS[v.tasks[k]]||v.tasks[k]||'—')}</span>`).join('');
  const scripts=v.scripts.length?`<table>${v.scripts.map(s=>{const m=s.text.match(/^script (v\d+):?\s*(.*)$/)||[];return `<tr><td class="n">${esc(m[1]||'')}</td><td>${esc(m[2]||s.text)}</td><td class="t">${when(s.at)}</td></tr>`;}).join('')}</table>`:'<div class="rv">no script yet</div>';
  const takes=v.takes.length?`<table>${v.takes.map(t=>`<tr><td class="n">v${t.revision}</td><td>${esc(t.file||'')}${t.duration?` · ${Math.round(t.duration)} s`:''}<div class="rv">${esc((t.review||'').replace(/^take review v\d+ · /,'').replace(/ · file .*$/,''))}</div></td><td class="t">${when(t.at)}</td></tr>`).join('')}</table>`:'<div class="rv">no takes yet</div>';
  const notes=v.notes.filter(n=>!/^deliverable: /.test(n.text)), del=v.notes.filter(n=>/^deliverable: /.test(n.text));
  const nl=notes.slice().reverse().map(n=>`<div class="note"><span class="by">${esc(n.by)}</span>${txt(n.text)}<span class="at">${when(n.at)} · ${esc(n.task)}</span></div>`).join('')||'<div class="rv">no notes yet</div>';
  const dl=del.map(n=>`<div class="note deliv">${txt(n.text.replace(/^deliverable: /,''))}<span class="at">${when(n.at)}</span></div>`).join('');
  return `<div class="video">
    <div><h3>VIDEO · ${esc(v.video)}</h3>${tasks}
      <div class="score">${v.score==null?'—':esc(v.score)}<small>score of the last scored take</small></div>
      <h3>SCRIPT VERSIONS</h3>${scripts}
      <p><a href="${esc(v.url)}">open in Kitsu</a></p></div>
    <div><h3>TAKES (KITSU REVISIONS)</h3>${takes}${dl?`<h3>DELIVERABLE</h3>${dl}`:''}</div>
    <div><h3>FEEDBACK, NEWEST FIRST</h3>${nl}</div>
  </div>`;
}
async function load(){
  let d=null;try{d=await (await fetch('/lanes.json?'+Date.now(),{credentials:'include'})).json();}catch(e){}
  const s=d&&d.studio;
  if(!s){$('main').innerHTML='<div class="empty">No studio feed yet: KV <code>lanes</code> has no <code>studio</code> block (push-kv.sh on Ra joins <code>vsl studio feed</code> into it every 2 min).</div>';return;}
  if(s.studio_url)$('open').href=s.studio_url;
  $('upd').textContent=s.measured_at?`measured ${when(s.measured_at)} from Kitsu`:'';
  if(!s.clients||!s.clients.length){$('main').innerHTML=`<div class="empty">${esc(s.empty||s.error||'No VSLs in Kitsu yet.')}</div>`;return;}
  $('main').innerHTML=s.clients.map(c=>`<section class="client"><h2>${esc(c.client)}<small>last activity ${when(c.last)}</small></h2>${c.videos.map(v=>video(c,v)).join('')}</section>`).join('');
}
load();setInterval(load,60000);
</script>
</body>
</html>
