# Kitsu + Zou on Ra (knowledge#14747). Loopback only: `tailscale serve --https=8451` is the only door in
# (tailnet), and the Cloudflare tunnel's studio.utopiamodels.ai rule points at that serve URL behind Access.
server {
    listen 127.0.0.1:8820;
    server_name _;

    location /api {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:5000/;
        client_max_body_size 2000M;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
    }

    location /socket.io {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_pass http://127.0.0.1:5001;
    }

    location / {
        root  /opt/kitsu/dist;
        try_files $uri $uri/ /index.html;
    }
}
